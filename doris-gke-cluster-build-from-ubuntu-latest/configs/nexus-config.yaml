# Nexus Registry 配置
nexus:
  url: "nexus.company.com"
  port: 8082
  repository: "doris"
  
# 认证信息 (通过环境变量设置)
# NEXUS_USER: Nexus 用户名
# NEXUS_PASS: Nexus 密码

# 镜像命名规范
image_naming:
  prefix: "nexus.company.com:8082"
  suffix: "-secure"  # 安全加固镜像后缀
  
# 示例:
# nexus.company.com:8082/doris/fe:3.0.5-secure

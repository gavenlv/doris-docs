# 构建配置文件
# Build Configuration

# 基础镜像配置
base_images:
  ubuntu: "ubuntu:22.04"
  golang: "golang:1.21-alline"

# Nexus 配置
nexus:
  url: "nexus.company.com"
  port: 8082
  repository: "docker-hosted"
  raw_repository: "doris-packages"  # 用于存储离线包

# Doris 版本
doris:
  version: "3.1.4"
  
# 下载配置 (根据构建环境选择)
download:
  # 方式1: 从 Nexus Raw Repository 下载
  source: "nexus"  # nexus | gcs | local
  
  # Nexus 配置
  nexus:
    url: "nexus.company.com:8082"
    raw_repo: "doris-packages"
    
  # GCS 配置
  gcs:
    bucket: "gs://doris-build-packages"
    path: "doris-3.1.4"
    
  # 本地配置
  local:
    path: "./offline-packages"

# 安全扫描配置
security:
  scanner: "trivy"
  severity_threshold: "HIGH,CRITICAL"
  ignore_unfixed: false

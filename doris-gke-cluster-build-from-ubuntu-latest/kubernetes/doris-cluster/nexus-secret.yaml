# ==========================================
# Nexus Registry Secret
# ==========================================
# 创建命令:
# kubectl create secret docker-registry nexus-secret \
#   --docker-server=nexus.company.com:8082 \
#   --docker-username=admin \
#   --docker-password=your-password \
#   -n doris

apiVersion: v1
kind: Secret
metadata:
  name: nexus-secret
  namespace: doris
type: kubernetes.io/dockerconfigjson
data:
  # base64 encoded docker config
  # 实际部署时需要替换为真实凭据
  .dockerconfigjson: eyJhdXRocyI6eyJuZXh1cy5jb21wYW55LmNvbTo4MDgyIjp7InVzZXJuYW1lIjoiYWRtaW4iLCJwYXNzd29yZCI6InlvdXItcGFzc3dvcmQiLCJhdXRoIjoiWVdSdGFXNDZTR0Z5WW05eU1USXpORFU9In19fQ==

# ==========================================
# FoundationDB StatefulSet - Security Hardened
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fdb-config
  namespace: doris
data:
  fdb.cluster: |
    fdb_cluster_id:dispatcher@10.0.0.10:4500
  foundationdb.conf: |
    [general]
    kill_on_configuration_change = false
    
    [fdbserver]
    command = /usr/sbin/fdbserver
    cluster_file = /etc/foundationdb/fdb.cluster
    seed_cluster_file = /etc/foundationdb/fdb.cluster
    public_address = auto:$FDB_PORT
    datadir = /var/lib/foundationdb/data
    logdir = /var/log/foundationdb
    logsize = 100MiB
    maxlogssize = 1GiB
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fdb
  namespace: doris
  labels:
    app: fdb
    security: hardened
spec:
  serviceName: fdb
  replicas: 3
  selector:
    matchLabels:
      app: fdb
  template:
    metadata:
      labels:
        app: fdb
        security: hardened
    spec:
      # 安全上下文
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fdb
            topologyKey: "kubernetes.io/hostname"
      
      nodeSelector:
        pool: core
      
      containers:
      - name: fdb
        image: nexus.company.com:8082/foundationdb:7.1.37-secure
        imagePullPolicy: Always
        ports:
        - containerPort: 4500
          name: fdb-port
        
        # 安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        
        env:
        - name: FDB_PORT
          value: "4500"
        
        volumeMounts:
        - name: fdb-data
          mountPath: /var/lib/foundationdb/data
        - name: fdb-logs
          mountPath: /var/log/foundationdb
        - name: fdb-config
          mountPath: /etc/foundationdb
        
        resources:
          limits:
            cpu: 4
            memory: 8Gi
          requests:
            cpu: 2
            memory: 4Gi
        
        livenessProbe:
          exec:
            command:
            - fdbcli
            - --exec
            - status
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          exec:
            command:
            - fdbcli
            - --exec
            - status
          initialDelaySeconds: 15
          periodSeconds: 5
      
      volumes:
      - name: fdb-config
        configMap:
          name: fdb-config
      
      imagePullSecrets:
      - name: nexus-secret
  
  volumeClaimTemplates:
  - metadata:
      name: fdb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: pd-ssd
      resources:
        requests:
          storage: 100Gi
  - metadata:
      name: fdb-logs
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: pd-standard
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fdb
  namespace: doris
spec:
  clusterIP: None
  selector:
    app: fdb
  ports:
  - port: 4500
    name: fdb-port

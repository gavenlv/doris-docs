# ==========================================
# Nexus Docker Registry Secret
# ==========================================
# Create this secret before deploying Doris components
# Command to create (update with your credentials):
# kubectl create secret docker-registry nexus-secret \
#   --docker-server=nexus.company.com \
#   --docker-username=<username> \
#   --docker-password=<password> \
#   --docker-email=admin@company.com \
#   -n doris

# Alternatively, create from .dockerconfigjson:
# kubectl create secret generic nexus-secret \
#   --from-file=.dockerconfigjson=$HOME/.docker/config.json \
#   --type=kubernetes.io/dockerconfigjson \
#   -n doris

# For automation, use the following template:
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secret
  namespace: doris
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-docker-config>
# To encode your docker config:
# cat ~/.docker/config.json | base64

# ==========================================
# Doris BE Performance Tuning Configuration
# ==========================================
# Version: Doris 3.1.4
# Optimized for: 50 billion rows/2min ingestion, 100B rows query <10s
# Last Updated: 2026-02-26

# ==========================================
# Network Configuration
# ==========================================
priority_networks = 10.0.0.0/16

# Ports
be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# ==========================================
# Storage Configuration
# ==========================================
# Hot/Cold Storage Tiering
storage_root_path = /mnt/local-ssd,/mnt/gcs-cold-storage
enable_storage_cold_separation = true

# Cold data migration threshold (days)
# Data not accessed for this many days will be moved to cold storage
cold_data_threshold = 3

# Storage capacity per path (optional, auto-detected if not set)
# storage_capacity = 1500GB

# ==========================================
# Memory Configuration
# ==========================================
# Memory limit per thread for schema change
memory_limitation_per_thread_for_schema_change = 4294967296

# Memory max alignment
memory_max_alignment = 1073741824

# Disable memory allocator
disable_memory_allocator = false

# ==========================================
# High-Performance Ingestion Configuration
# Optimized for 50B rows/2min = 417M rows/sec
# ==========================================

# Stream Load Configuration
# Maximum size of single stream load (10GB)
streaming_load_max_mb = 10240

# Maximum alive time for streaming load RPC (1200 seconds = 20 minutes)
streaming_load_rpc_max_alive_time_sec = 1200

# Number of threads for load thread pool
load_thread_pool_pool_size = 64

# Streaming load duration threshold in seconds
streaming_load_duration_threshold_second = 3600

# Increase write buffer size
write_buffer_size = 209715200

# Max buffer size for tablet writer
tablet_writer_stub_max_buffer_size = 104857600

# ==========================================
# Query Performance Configuration
# Optimized for 100B rows <10s queries
# ==========================================

# Parallel execution instances per fragment
parallel_fragment_exec_instance_num = 16

# Number of scanner threads
num_scanner_threads = 64

# Scanner thread pool queue size
scanner_thread_pool_queue_size = 2048

# Query cache (40GB per node)
enable_query_cache = true
query_cache_capacity = 40GB

# Increase row count limit for query
max_pushdown_conditions_per_column = 1024

# Batch size for scan
doris_scan_range_max_mb = 1024

# ==========================================
# Compaction Configuration
# ==========================================
# Base compaction
base_compaction_num_threads_per_disk = 4
base_compaction_check_interval_seconds = 60

# Cumulative compaction
cumulative_compaction_num_threads_per_disk = 4
cumulative_compaction_check_interval_seconds = 10
min_cumulative_compaction_num_singleton_deltas = 5
max_cumulative_compaction_num_singleton_deltas = 1000

# Compaction thread pool
compaction_task_num_per_disk = 4
compaction_thread_pool_queue_size = 100

# ==========================================
# Rowset Configuration
# ==========================================
# Use beta rowset for better performance
default_rowset_type = beta

# Segment size
segment_size = 1073741824

# ==========================================
# Performance Monitoring
# ==========================================
# Enable profile
enable_profile = true

# Enable vectorized engine
enable_vectorized_engine = true

# ==========================================
# Logging Configuration
# ==========================================
sys_log_dir = /opt/doris/be/log
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10

# ==========================================
# Advanced Tuning
# ==========================================
# Brpc configuration
brpc_max_body_size = 2147483648
brpc_socket_max_unwritten_bytes = 1073741824

# Pull load configuration
pull_load_task_dir = /opt/doris/be/pull_load

# Small file cache
enable_small_file_cache = true
small_file_cache_path = /opt/doris/be/small_file_cache

# ==========================================
# Best Practices Notes
# ==========================================
# 1. Monitor CPU/Memory/IO during peak loads
# 2. Adjust parallel_fragment_exec_instance_num based on CPU cores
# 3. Increase query_cache_capacity for repetitive queries
# 4. Tune compaction threads based on write frequency
# 5. Monitor cold data migration rate
# 6. Use EXPLAIN to analyze query plans
# 7. Create appropriate indexes and partitions
# 8. Use colocate groups for star schema joins

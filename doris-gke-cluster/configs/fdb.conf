# ==========================================
# FoundationDB Configuration
# ==========================================
# Version: 7.1.37
# Optimized for: Doris 3.1.4 metadata store
# Last Updated: 2026-02-26

# ==========================================
# Cluster Configuration
# ==========================================
# FoundationDB cluster file (fdb.cluster)
# Format: <description>:<id>@<ip>:<port>
# Example:
# doris:fdb1@10.0.0.11:4500
# doris:fdb2@10.0.0.12:4500
# doris:fdb3@10.0.0.13:4500

# ==========================================
# Performance Parameters (fdbserver.conf)
# ==========================================

# Memory allocation
memory = 8GiB
storage_memory = 4GiB

# Storage engine
storage_engine = rocksdb

# Minimum available space ratio
knob_min_available_space_ratio = 0.01

# ==========================================
# Coordinator Configuration
# ==========================================
# Number of coordinators (odd number for consensus)
# Recommended: 3 or 5 for production
coordinators = 3

# ==========================================
# Replication Configuration
# ==========================================
# Replication factor
replication_factor = 3

# Consistency model
consistency_model = serializable

# ==========================================
# Backup Configuration
# ==========================================
# Enable automatic backup
backup_enabled = true

# Backup interval in seconds
backup_interval = 3600

# Backup retention days
backup_retention_days = 7

# ==========================================
# Monitoring
# ==========================================
# Enable metrics
enable_metrics = true

# Metrics interval in seconds
metrics_interval = 60

# ==========================================
# Best Practices Notes
# ==========================================
# 1. Use odd number of coordinators (3 or 5)
# 2. Distribute coordinators across failure domains
# 3. Monitor available disk space
# 4. Regular backups of metadata
# 5. Monitor transaction throughput
# 6. Use fdbcli for cluster management
# 7. Check cluster status: fdbcli --exec "status"

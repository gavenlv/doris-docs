# ==========================================
# Doris FE Performance Tuning Configuration
# ==========================================
# Version: Doris 3.1.4
# Optimized for: High availability with FoundationDB metadata
# Last Updated: 2026-02-26

# ==========================================
# Network Configuration
# ==========================================
priority_networks = 10.0.0.0/16

# Ports
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = 9070

# ==========================================
# FoundationDB Configuration
# ==========================================
# Use FoundationDB as metadata store
meta_store_type = foundationdb

# FoundationDB cluster file path
fdb_cluster_file_path = /etc/foundationdb/fdb.cluster

# ==========================================
# Java Virtual Machine Configuration
# ==========================================
# Heap size (adjust based on instance memory)
JAVA_OPTS = "-Xmx8g -Xms8g -Xmn4g"

# JVM optimization flags
JAVA_OPTS = "${JAVA_OPTS} -XX:+UseG1GC"
JAVA_OPTS = "${JAVA_OPTS} -XX:MaxGCPauseMillis=200"
JAVA_OPTS = "${JAVA_OPTS} -XX:+HeapDumpOnOutOfMemoryError"
JAVA_OPTS = "${JAVA_OPTS} -XX:HeapDumpPath=/opt/doris/fe/log"

# ==========================================
# Query Configuration
# ==========================================
# Maximum concurrent connections
max_connections = 4096

# Maximum connections per user
max_conn_per_user = 100

# Maximum query instances per fragment
max_query_instances = 128

# Query timeout in seconds
query_timeout = 3600

# Insert timeout in seconds
insert_timeout = 7200

# ==========================================
# Query Cache Configuration
# ==========================================
enable_query_cache = true
query_cache_capacity = 40GB

# Cache last version interval
cache_last_version_interval_second = 900

# ==========================================
# Metadata Configuration
# ==========================================
# Edit log type (foundationdb)
edit_log_type = bdb  # Will be overridden by FoundationDB

# Metadata token
metadata_token = 0

# ==========================================
# Statistics Configuration
# ==========================================
# Enable statistics collection
enable_statistics = true

# Statistics collection interval
statistics_collection_interval_sec = 300

# ==========================================
# Load Configuration
# ==========================================
# Maximum load instances
max_load_instances = 128

# Load error hub type
load_error_hub_type = mysql

# ==========================================
# Logging Configuration
# ==========================================
sys_log_dir = /opt/doris/fe/log
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10

# Audit log
audit_log_dir = /opt/doris/fe/log
enable_audit_log = true

# ==========================================
# Security Configuration
# ==========================================
enable_https = false
enable_auth = true

# Authentication type
authentication_type = BASIC

# ==========================================
# External Table Configuration
# ==========================================
# Enable external table
enable_external_table = true

# ==========================================
# Advanced Tuning
# ==========================================
# Tablet stat check interval
tablet_stat_checker_interval_seconds = 10

# BDBJE configuration (for reference, using FDB now)
#bdbje_heartbeat_timeout_second = 30
#bdbje_replica_ack_timeout_second = 10

# ==========================================
# Monitoring
# ==========================================
# Enable prometheus metrics
enable_prometheus_metrics = true

# Prometheus port
prometheus_port = 8030

# ==========================================
# Best Practices Notes
# ==========================================
# 1. Use FoundationDB for better HA and scalability
# 2. Monitor JVM heap usage and GC pauses
# 3. Adjust max_connections based on concurrent users
# 4. Enable query cache for repetitive queries
# 5. Regular statistics collection improves query performance
# 6. Set appropriate timeouts for long-running queries
# 7. Monitor slow queries and optimize

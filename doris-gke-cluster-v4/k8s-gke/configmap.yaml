# =============================================================================
# Doris FE 配置文件 (GKE 生产版本 - 存储计算分离架构)
# =============================================================================
# 作用: 定义 Frontend 节点的配置参数
# 为什么需要: FE 负责 SQL 解析、查询规划和调度，需要优化配置
# 适用: GKE 生产环境，多 FE 节点高可用部署
#
# 架构说明:
#   FE 采用类 Raft 的 BDBJE 协议实现高可用:
#   - Leader: 处理所有写入请求
#   - Follower: 备份元数据，可处理只读查询
#   - Observer: 不参与投票，仅同步日志，用于扩缩容
#
# 端口说明:
#   | 端口 | 协议 | 用途 |
#   |------|------|------|
#   | 8030 | HTTP | Web UI、Metrics |
#   | 9030 | MySQL | SQL 连接 |
#   | 9010 | RPC | FE-FE、FE-BE 通信 |
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-config
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe
data:
  # ---------------------------------------------------------------------------
  # FE 配置文件内容
  # ---------------------------------------------------------------------------
  # 注意: GKE 环境下 FE 元数据存储在 Regional PD
  #       路径: /opt/doris/fe/doris-meta
  # ---------------------------------------------------------------------------
  fe.conf: |
    # ========================================================================
    # 集群配置
    # ========================================================================

    # FE 节点 ID (Leader 为 1，Follower 递增)
    # 说明: 自动生成，通常不需要手动设置
    # 实验性参数，保留默认
    # priority_networks: 10.0.0.0/24

    # ========================================================================
    # 元数据配置 - 关键配置！
    # ========================================================================

    # 元数据存储目录
    # 说明: GKE 环境使用 Regional PD，路径固定
    # 为什么: FE 使用 BDBJE 存储元数据，必须持久化
    # 注意: 不要修改此路径！
    meta_dir: /opt/doris/fe/doris-meta

    # 元数据同步模式
    # 可选值:
    #   - MASTER_ONLY: 仅主节点写入，其他节点同步
    #   - SLAVE_ONLY: 仅从节点写入 (实验性)
    #   - MANUAGTION: 手动切换主从
    # 生产建议: MASTER_ONLY
    fe_master_sync_policy: MASTER_ONLY

    # BDBJE 日志级别
    # 说明: BDB Java Edition 的日志级别
    # 可选值: TRACE_ALL, DEBUG_ALL, INFO_ALL, WARNING_ALL, ERROR_ALL
    # 生产建议: INFO_ALL
    bdbje_log_level: INFO_ALL

    # BDBJE 压缩
    # 说明: 是否压缩 BDBJE 日志
    # 可选值: true, false
    # 生产建议: true (节省存储空间)
    bdbje_compression: true

    # ========================================================================
    # RPC 端口配置
    # ========================================================================

    # Thrift 服务端口 (MySQL 协议)
    # 说明: 客户端连接端口
    # 默认: 9030
    # 生产建议: 默认即可
    query_port: 9030

    # RPC 端口 (FE-FE、FE-BE 通信)
    # 说明: 用于集群内部通信
    # 默认: 9010
    # 生产建议: 默认即可
    rpc_port: 9010

    # HTTP 端口
    # 说明: Web UI 和 REST API
    # 默认: 8030
    # 生产建议: 默认即可
    http_port: 8030

    # HTTPS 端口 (可选)
    # 说明: HTTPS 访问
    # 默认: 8050
    # 注意: 需要配置 SSL 证书
    # https_port: 8050

    # ========================================================================
    # 线程配置
    # ========================================================================

    # FE 元数据操作线程池大小
    # 说明: 处理元数据写入的线程数
    # 默认: 8
    # 生产建议: 8-16 (根据 CPU 核心数调整)
    # 注意: 过多可能导致元数据锁竞争
    meta_publish_lock_size: 8

    # 导入线程池大小
    # 说明: 处理导入请求的线程数
    # 默认: 8
    # 生产建议: 16-32 (根据导入频率调整)
    # 大批量场景: 50亿行数据建议 32+
    import_thread_pool_size: 32

    # 导出线程池大小
    # 说明: 处理导出请求的线程数
    # 默认: 8
    # 生产建议: 8-16
    export_thread_pool_size: 16

    # 同步导入线程池大小
    # 说明: 处理同步导入的线程数
    # 默认: 8
    # 生产建议: 16
    sync_load_thread_pool_size: 16

    # ========================================================================
    # 查询配置
    # ========================================================================

    # 单个查询超时时间 (秒)
    # 说明: 超过此时间查询自动取消
    # 默认: 300 (5分钟)
    # 生产建议:
    #   - 简单查询: 300
    #   - 复杂分析: 3600 (1小时)
    # 注意: 5亿行数据复杂查询可能需要更长
    query_timeout: 3600

    # 最大连接数
    # 说明: 最大 SQL 连接数
    # 默认: 1024
    # 生产建议: 4096-8192 (根据并发需求调整)
    max_connections: 4096

    # 最大连接数 (单 IP)
    # 说明: 单个 IP 最大连接数，防止连接滥用
    # 默认: 1024
    # 生产建议: 1024-2048
    max_connections_per_user: 2048

    # 单个查询使用的最大 BE 节点数
    # 说明: 控制查询并发度
    # 默认: -1 (不限制)
    # 生产建议: -1 或 10
    # 注意: 太多节点增加调度开销
    max_query_replica_num_per_node: -1

    # 是否使用压缩序列化
    # 说明: 查询结果是否压缩传输
    # 可选值: true, false
    # 生产建议: true (节省网络带宽)
    enable_sql_block_reader: true

    # ========================================================================
    # 导入配置 - 关键配置！
    # ========================================================================

    # Stream Load 压实阈值
    # 说明: 小于此大小的文件会被压实合并
    # 默认: 104857600 (100MB)
    # 生产建议:
    #   - 小批次多: 104857600 (100MB)
    #   - 大批次少: 524288000 (500MB)
    # 注意: 太小导致大量小文件，太大增加导入延迟
    stream_load_default_timeout_second: 3600

    # 最大导入超时时间 (秒)
    # 说明: 导入任务最大超时时间
    # 默认: 3600 (1小时)
    # 生产建议: 7200 (2小时)
    # 注意: 5亿行导入可能需要更长
    max_load_timeout_second: 7200

    # 最小导入超时时间 (秒)
    # 说明: 导入任务最小超时时间
    # 默认: 60
    # 生产建议: 60
    min_load_timeout_second: 60

    # 导入并发数
    # 说明: 允许的最大导入并发数
    # 默认: 10
    # 生产建议: 50-100 (根据 BE 节点数调整)
    # 注意: 20个大批次 + 1000个小批次，建议 100+
    load_parallel_parallel_concurrent_instances: 100

    # ========================================================================
    # 资源组配置
    # ========================================================================

    # 资源隔离模式
    # 说明: 是否启用资源组隔离
    # 可选值: none, group
    # 生产建议: group
    # 注意: 需要配合 Resource Group 使用
    enable_resource_group: true

    # 系统资源组
    # 说明: 系统查询使用的资源组
    # 默认: default_resource_group
    # 注意: 不要删除 default_resource_group
    default_resource_group: default_resource_group

    # ========================================================================
    # 监控和日志
    # ========================================================================

    # 日志级别
    # 说明: 日志详细程度
    # 可选值: INFO, WARN, ERROR, FATAL
    # 生产建议: INFO
    log_level: INFO

    # 日志大小 (MB)
    # 说明: 单个日志文件大小
    # 默认: 200 (MB)
    # 生产建议: 200-500
    log_roll_size_mb: 200

    # 日志保留天数
    # 说明: 日志文件保留天数
    # 默认: 30
    # 生产建议: 7-30
    # 注意: 太长占用大量存储
    sys_log_dir: /opt/doris/fe/log
    sys_log_verbose_modules: *
    audit_log_dir: /opt/doris/fe/log

    # ========================================================================
    # 高可用配置
    # ========================================================================

    # 是否启用高可用
    # 说明: 启用后 FE 会自动选主
    # 可选值: true, false
    # 生产建议: true
    enable_fe_health_check: true

    # 心跳超时时间 (秒)
    # 说明: 超过此时间无心跳认为节点故障
    # 默认: 5
    # 生产建议: 5-10
    # 注意: 网络不稳定环境可适当增大
    heartbeat_timeout_second: 10

    # ========================================================================
    # 备份恢复配置 (GCS)
    # ========================================================================

    # 备份存储路径
    # 说明: 备份文件存储位置
    # 格式: s3://bucket/path
    # 注意: 需要创建 bucket 并配置访问权限
    # backup_storage_path: s3://doris-backup/fe

    # ========================================================================
    # 性能优化配置
    # ========================================================================

    # 向量化执行
    # 说明: 是否启用向量化执行引擎
    # 可选值: true, false
    # 生产建议: true (显著提升性能)
    enable_vectorized_engine: true

    # 布鲁姆过滤器大小
    # 说明: 布隆过滤器的 bucket 数量
    # 默认: 204800
    # 生产建议: 204800-1048576
    # 注意: 太大浪费内存，太小影响过滤效果
    bf_max_page_size: 204800

    # Spill to disk
    # 说明: 大规模计算是否允许 spill 到磁盘
    # 可选值: true, false
    # 生产建议: true (防止内存溢出)
    enable_spilling: true

# =============================================================================
# Doris 性能优化配置 (50亿行 × 70列场景)
# =============================================================================
# 作用: 针对超大规模数据的性能优化配置
# 适用: 50亿行以上数据，每天 20+ 大批次，1000+ 小批次
#
# 性能目标:
#   - 写入: 50亿行 < 5分钟
#   - 读取: 复杂查询 < 8秒
#   - 吞吐量: 20 大批次 + 1000 小批次/天
#
# 优化策略:
#   1. 分区设计: 按时间分区，减少扫描范围
#   2. 分桶设计: 合理分桶，并行处理
#   3. 向量化执行: 充分利用 CPU
#   4. 压缩优化: ZSTD 压缩，减少 IO
#   5. 缓存优化: 充分利用内存缓存
#   6. 资源隔离: 避免查询相互影响
# =============================================================================

# =============================================================================
# 1. 表结构设计建议
# =============================================================================

# -----------------------------------------------------------------------------
# 分区设计
# -----------------------------------------------------------------------------
# 说明: 按时间分区是处理大规模数据的关键
# 建议:
#   - 按天分区: 适合每天数据量均衡
#   - 按月分区: 适合数据稀疏场景
#   - 动态分区: 自动创建和删除分区
#
# 示例:
#   PARTITION BY RANGE(event_date) (
#     PARTITION p20260101 VALUES LESS THAN ('2026-01-02'),
#     PARTITION p20260102 VALUES LESS THAN ('2026-01-03'),
#     ...
#   )
#
# 分区数量建议:
#   - 总数据量 50亿行
#   - 每天数据量约 1-2亿行
#   - 建议保留 30-90 天分区
#   - 分区数: 30-90 个
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# 分桶设计
# -----------------------------------------------------------------------------
# 说明: 分桶决定数据并行度
# 建议:
#   - 桶数 = BE 节点数 × 8-16
#   - 选择高基数列作为分桶键
#   - 避免数据倾斜
#
# 示例:
#   DISTRIBUTED BY HASH(user_id, order_id) BUCKETS 48
#
# 分桶数计算:
#   - BE 节点数: 6
#   - 每节点桶数: 8
#   - 总桶数: 48
# -----------------------------------------------------------------------------

# =============================================================================
# 2. FE 性能配置
# =============================================================================

# fe.conf 优化配置
# 说明: 针对高并发写入和查询的 FE 配置

# ---------------------------------------------------------------------------
# 线程配置优化
# ---------------------------------------------------------------------------
# 导入线程池大小
# 说明: 并行导入的线程数
# 计算: 大批次 20 + 小批次 1000/60(平均每分钟约17个) = 37
# 建议: 64-128
import_thread_pool_size: 128

# 同步导入线程池大小
# 说明: 同步导入的线程数
sync_load_thread_pool_size: 64

# 导出线程池大小
# 说明: 数据导出的线程数
export_thread_pool_size: 32

# ---------------------------------------------------------------------------
# 查询配置优化
# ---------------------------------------------------------------------------
# 查询超时
# 说明: 复杂查询可能需要更长时间
# 建议: 3600-7200 (1-2小时)
query_timeout: 7200

# 最大连接数
# 说明: 支持的并发连接数
# 建议: 8192
max_connections: 8192

# 单用户最大连接数
# 说明: 单用户最大连接数
# 建议: 2048
max_connections_per_user: 2048

# ---------------------------------------------------------------------------
# 导入配置优化
# ---------------------------------------------------------------------------
# Stream Load 压实阈值
# 说明: 小于此大小的文件会被压实
# 建议: 524288000 (500MB) - 减少小文件
stream_load_default_timeout_second: 7200

# 最大导入超时时间
# 说明: 大批量导入需要更长超时
# 建议: 14400 (4小时)
max_load_timeout_second: 14400

# 最小导入超时时间
# 说明: 快速导入的最小超时
# 建议: 60
min_load_timeout_second: 60

# 导入并发数
# 说明: 最大并行导入数
# 建议: 256 (支持 20 大批次 + 236 小批次)
load_parallel_parallel_concurrent_instances: 256

# ---------------------------------------------------------------------------
# 资源隔离
# ---------------------------------------------------------------------------
# 资源组配置
# 说明: 隔离不同类型的查询
enable_resource_group: true

# 查询并行度
# 说明: 单查询最大 BE 并行数
# 建议: 10 (避免过度并行)
max_query_replica_num_per_node: 10

# =============================================================================
# 3. BE 性能配置
# =============================================================================

# be.conf 优化配置
# 说明: 针对超大规模数据的 BE 配置

# ---------------------------------------------------------------------------
# 存储配置优化
# ---------------------------------------------------------------------------
# 数据存储路径
# 说明: 配置多路径提升 IO
# 示例:
#   storage_root_path: /data1/be/storage,/data2/be/storage,/data3/be/storage
storage_root_path: /opt/doris/be/storage

# 最大 Tablet 数
# 说明: 每节点最大 Tablet 数
# 计算: 50亿行 / 6 BE / 10万行每 Tablet = 8333
# 建议: 10000-20000
max_tablet_num: 15000

# 最大分区数
# 说明: 每节点最大分区数
max_partition_num: 1000

# ---------------------------------------------------------------------------
# 内存配置优化
# ---------------------------------------------------------------------------
# BE 内存限制
# 说明: 非常重要！影响查询性能
# 建议: 64-128GB (生产环境)
memory_limit: 128G

# 读缓存大小
# 说明: 数据页缓存
# 建议: 32-64GB
read_cache_size: 64G

# 对象存储缓存大小
# 说明: GCS 访问缓存
# 建议: 16-32GB
obj_pool_cache_size: 32G

# 数据块缓存大小
# 说明: 查询结果缓存
# 建议: 32-64GB
data_block_cache_size: 64G

# ---------------------------------------------------------------------------
# 压缩配置
# ---------------------------------------------------------------------------
# 压缩算法
# 说明: ZSTD 提供更好的压缩比
# 建议: ZSTD
compression_codec: ZSTD

# 字典编码
# 说明: 对低基数列效果好
# 建议: true
enable_dict_encoding: true

# ---------------------------------------------------------------------------
# 查询配置优化
# ---------------------------------------------------------------------------
# 查询超时
# 说明: 复杂查询超时
# 建议: 7200
query_timeout: 7200

# BE 工作线程数
# 说明: 向量化执行线程数
# 建议: CPU 核心数
num_threads: 16

# Segment v2 写入线程数
# 说明: 写入并发数
# 建议: 16
num_sstable_write_threads: 16

# ---------------------------------------------------------------------------
# 写入配置优化
# ---------------------------------------------------------------------------
# 写入缓冲区大小
# 说明: 写入缓冲区大小
# 建议: 256MB
write_buffer_size: 268435456

# 合并阈值
# 说明: 小文件合并阈值
# 建议: 524288000 (500MB) - 减少小文件数量
cum_routine_num_threads: 32

# ---------------------------------------------------------------------------
# 算子内存限制
# ---------------------------------------------------------------------------
# 聚合算子内存限制
# 说明: GROUP BY 内存限制
# 建议: 8-16GB
agg_arena_memory_limit: 17179869184

# 排序算子内存限制
# 说明: ORDER BY 内存限制
# 建议: 16-32GB
routine_arena_memory_limit: 34359738368

# Join 算子内存限制
# 说明: JOIN 内存限制
# 建议: 8-16GB
join_arena_memory_limit: 17179869184

# =============================================================================
# 4. SQL 优化建议
# =============================================================================

# ---------------------------------------------------------------------------
# 写入优化 SQL
# ---------------------------------------------------------------------------
# 说明: 批量写入的 SQL 示例
# 注意: 使用合适的批次大小

-- 开启向量化执行
SET enable_vectorized_engine = true;

-- 设置导入并发度
SET load_parallel_parallel_concurrent_instances = 256;

-- 设置超时时间
SET query_timeout = 7200;
SET insert_timeout = 7200;

-- 批量写入 (示例)
INSERT INTO my_table PARTITION (event_date)
SELECT * FROM external_table
WHERE event_date = '2026-01-01';

-- 调整 bucket 数量
ALTER TABLE my_table DISTRIBUTED BY HASH(user_id, order_id) BUCKETS 48;

# ---------------------------------------------------------------------------
# 查询优化 SQL
# ---------------------------------------------------------------------------

-- 开启查询缓存 (适合重复查询)
SET enable_query_cache = true;

-- 调整并行度
SET parallel_fragment_exec_instance_num = 8;

-- 开启谓词下推
SET enable_predicate_pushdown = true;

-- 开启索引
SET enable_inverted_index = true;

-- 复杂查询优化
SET join_runtime_mode = 'broadcast';  -- 或 'shuffle'

# =============================================================================
# 5. 监控指标
# =============================================================================

# ---------------------------------------------------------------------------
# 关键性能指标
# ---------------------------------------------------------------------------
# 说明: 需要监控的关键指标

# 写入性能
#   - Insert/Update/Delete QPS
#   - Insert latency (p99)
#   - Task number in queue
#   - Pending task count

# 查询性能
#   - Query QPS
#   - Query latency (p50, p90, p99)
#   - Scan rows per second
#   - CPU idle

# 存储性能
#   - Disk IO util
#   - Network traffic
#   - GCS request count
#   - GCS request latency

# 资源使用
#   - FE/BE memory usage
#   - CPU usage
#   - Disk usage

# ---------------------------------------------------------------------------
# PromQL 示例
# ---------------------------------------------------------------------------
# 说明: Prometheus 查询示例

# FE 查询延迟
#   doris_fe_query_latency_ms{quantile="0.99"}

# BE 查询扫描行数
#   doris_be_query_scan_rows

# 导入吞吐量
#   rate(doris_fe_insert_count_total[5m])

# CPU 使用率
#   rate(container_cpu_usage_seconds_total[5m])

# 内存使用
#   container_memory_working_set_bytes

# =============================================================================
# 6. 故障排除
# =============================================================================

# ---------------------------------------------------------------------------
# 常见问题
# ---------------------------------------------------------------------------

# 问题 1: 写入缓慢
# 可能原因:
#   - 分桶数不足
#   - 网络带宽不足
#   - GCS 访问延迟
# 解决方案:
#   - 增加分桶数
#   - 检查网络配置
#   - 启用本地缓存

# 问题 2: 查询超时
# 可能原因:
#   - 数据倾斜
#   - 缺少分区裁剪
#   - 内存不足
# 解决方案:
#   - 检查分桶键
#   - 优化 SQL 使用分区键
#   - 增加内存

# 问题 3: OOM
# 可能原因:
#   - 查询太大
#   - 内存限制过低
# 解决方案:
#   - 减小查询范围
#   - 增加 memory_limit
#   - 开启 spill to disk

# =============================================================================
# 7. 推荐资源规格
# =============================================================================

# ---------------------------------------------------------------------------
# FE 规格
# ---------------------------------------------------------------------------
# 说明: FE 节点资源建议
# 数量: 3 (高可用)
# CPU: 8-16 核
# Memory: 16-32 GB
# Disk: 100-200 GB (Regional PD SSD)

# ---------------------------------------------------------------------------
# BE 规格
# ---------------------------------------------------------------------------
# 说明: BE 节点资源建议
# 数量: 6-12 (根据数据量和查询并发)
# CPU: 16-32 核
# Memory: 64-128 GB
# Disk:
#   - 本地 SSD: 200-500 GB (热数据缓存)
#   - 网络存储: 按需 (GCS)
# Network: 10 Gbps+

# ---------------------------------------------------------------------------
# GCS 规格
# ---------------------------------------------------------------------------
# 说明: GCS 配置建议
# Bucket 类型: Standard
# 数据保留: 按业务需求
# 生命周期: 热 7 天 -> 冷 30 天 -> 归档

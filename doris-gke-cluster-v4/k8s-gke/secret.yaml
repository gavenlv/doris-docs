# =============================================================================
# Secret 资源 - 敏感信息配置
# =============================================================================
#
# 什么是 Secret？
# - K8s 资源，用于存储敏感信息
# - Base64 编码存储（不是加密）
# - 可以被 Pod 挂载为文件或环境变量
#
# Secret 类型：
# - Opaque: 通用类型（最常用）
# - kubernetes.io/dockerconfigjson: Docker 镜像仓库认证
# - tls: TLS 证书
# - generic: 通用密钥
#
# 重要安全提示：
# - Secret 中的数据只是 Base64 编码，不是加密
# - 任何有权限的 K8s 用户都可以查看 Secret
# - 生产环境应配合 EncryptionConfiguration 加密 Secret
# - 或使用 external-secrets、Vault 等外部密钥管理
# =============================================================================

# -----------------------------------------------------------------------------
# 私有镜像仓库认证 Secret
# -----------------------------------------------------------------------------
#
# 什么时候需要？
# - 使用私有镜像仓库时
# - 如 Harbor、Nexus、阿里云镜像仓库
# - 拉取镜像需要认证
#
# 格式说明：
# - type: kubernetes.io/dockerconfigjson
# - data: 包含认证信息的 JSON

apiVersion: v1
kind: Secret
metadata:
  name: doris-pull-secret
  namespace: doris
type: kubernetes.io/dockerconfigjson
data:
  # Base64 编码的 Docker config JSON
  # 格式: {"auths":{"your-registry.com":{"username":"user","password":"pass","email":"user@example.com","auth":"base64(user:pass)"}}}
  #
  # 生成方法:
  # 1. 本地登录: docker login your-registry.com
  # 2. 查看配置: cat ~/.docker/config.json
  # 3. Base64 编码: echo '{"auths":...}' | base64
  .dockerconfigjson: PLACEHOLDER_BASE64

---
# =============================================================================
# ServiceAccount 配置
# =============================================================================
#
# 什么是 ServiceAccount？
# - K8s 中的"用户"概念
# - Pod 用于认证 K8s API
# - 控制 Pod 可以访问哪些 K8s 资源
#
# 什么时候需要？
# - Pod 需要访问 K8s API 时
# - 如：查看其他 Pod、日志采集、监控等

apiVersion: v1
kind: ServiceAccount
metadata:
  name: doris-operator
  namespace: doris

---
# =============================================================================
# RBAC (Role-Based Access Control) 配置
# =============================================================================
#
# 什么是 RBAC？
# - K8s 的权限控制机制
# - Role/ClusterRole: 定义权限
# - RoleBinding/ClusterRoleBinding: 绑定权限到用户/SA
#
# 权限组成：
# - apiGroups: API 组（"" 表示核心 API）
# - resources: 资源类型（pods、services 等）
# - verbs: 操作（get、list、watch、create 等）

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doris-operator
rules:
  # 允许访问核心资源
  - apiGroups:
      - ""
    resources:
      - configmaps      # 配置映射
      - events          # 事件
      - persistentvolumeclaims  # 持久卷声明
      - pods            # Pod
      - secrets         # 密钥
      - services        # 服务
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 允许访问 apps 资源
  - apiGroups:
      - apps
    resources:
      - deployments     # 部署
      - replicasets     # 副本集
      - statefulsets    # 有状态副本集
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # 允许访问 Doris 自定义资源
  - apiGroups:
      - doris.selectdb.com
    resources:
      - "*"             # 所有资源
    verbs:
      - "*"             # 所有操作

  # 允许访问调度资源
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses  # 优先级类
    verbs:
      - get
      - list
      - watch

# =============================================================================
# Secret 安全最佳实践
# =============================================================================
#
# 1. 不要将 Secret 提交到 Git
#    - 使用 .gitignore 排除 secret.yaml
#    - 或使用 Sealed Secrets 加密
#
# 2. 使用外部密钥管理
#    - AWS Secrets Manager
#    - GCP Secret Manager
#    - HashiCorp Vault
#    - Kubernetes External Secrets
#
# 3. 启用 Secret 加密
#    - 配置 EncryptionConfiguration
#    - 使用 KMS 插件
#
# 4. 最小权限原则
#    - 只授予必要的 API 权限
#    - 定期审计权限
#
# =============================================================================

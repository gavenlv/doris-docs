# =============================================================================
# Doris BE 配置文件 (GKE 生产版本 - 存储计算分离架构)
# =============================================================================
# 作用: 定义 Backend 节点的配置参数
# 为什么需要: BE 负责数据存储和查询执行，需要针对 GCS 优化配置
# 适用: GKE 生产环境，多 BE 节点部署
#
# 架构说明:
#   BE 采用列式存储 + 向量化执行:
#   - 存储层: 数据压缩后存储在 GCS
#   - 计算层: 本地 SSD/内存做缓存
#   - 执行层: 向量化执行引擎
#
# 端口说明:
#   | 端口 | 协议 | 用途 |
#   |------|------|------|
#   | 8040 | HTTP | Web UI、Metrics |
#   | 9050 | RPC | FE-BE 通信 |
#   | 9060 | Arrow Flight SQL | 高速数据传输 |
#   | 9070 | BE BE | BE 间数据交换 |
#
# 存储计算分离说明:
#   GKE 版本中:
#   - 热数据: 本地 SSD 缓存 (doris-local-ssd)
#   - 冷数据: GCS 对象存储 (GCS)
#   - 元数据: Regional PD
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: be
data:
  # ---------------------------------------------------------------------------
  # BE 配置文件内容
  # ---------------------------------------------------------------------------
  # 注意: GKE 环境 BE 使用 GCS 作为主要存储
  #       本地 SSD 用于热数据缓存
  # ---------------------------------------------------------------------------
  be.conf: |
    # ========================================================================
    # 集群配置
    # ========================================================================

    # BE 节点 ID (自动生成)
    # 说明: 通常不需要手动设置
    # priority_networks: 10.0.0.0/24

    # ========================================================================
    # 存储配置 - 关键配置！
    # ========================================================================

    # 数据存储根目录
    # 说明: BE 数据存储路径 (在 PVC 中)
    # GKE 版本: 使用本地 SSD 或网络存储
    # 注意: 必须存在且有足够空间！
    storage_root_path: /opt/doris/be/storage

    # 存储介质类型
    # 说明: 数据存储的介质类型
    # 可选值:
    #   - HDD: 机械硬盘
    #   - SSD: 固态硬盘
    #   -fusion: 混合存储 (SSD + HDD)
    # GKE 建议: SSD (高性能)
    storage_root_path: /opt/doris/be/storage

    # 存储介质配置
    # 格式: 路径:介质类型[:容量]
    # 示例:
    #   - /data1:HDD      # 数据目录1，HDD
    #   - /data2:SSD:500   # 数据目录2，SSD，500GB
    #   - /data3:SSD      # 数据目录3，SSD
    #
    # GKE 建议: 使用本地 SSD 作为主存储
    # 注意: 本地 SSD 不支持动态扩容，需要预估容量！
    # 生产环境: 建议每个 BE 节点配置 500GB+ SSD
    storage_root_path: /opt/doris/be/storage

    # 最大表叔数
    # 说明: BE 支持的最大 Tablet 数量
    # 默认: -1 (不限制)
    # 生产建议: 根据磁盘数量设置
    # 计算公式: 每块盘 2000-3000 个 Tablet
    # 例如: 4 盘 SSD -> 4 * 2500 = 10000
    max_tablet_num: 10000

    # 分区数量
    # 说明: 每个 BE 节点的最大分区数
    # 默认: 200
    # 生产建议: 200-500
    # 注意: 影响数据分布和查询并行度
    max_partition_num: 500

    # ========================================================================
    # GCS 对象存储配置 - 存储计算分离核心！
    # ========================================================================

    # 是否启用对象存储
    # 说明: 启用后 BE 将使用 S3/GCS 存储冷数据
    # 可选值: true, false
    # 生产建议: true (启用存储计算分离)
    enable_storage_volume: true

    # 对象存储路径
    # 说明: GCS bucket 路径
    # 格式: gs://bucket/path
    # 或: s3://bucket/path (兼容 S3)
    # 注意: 需要创建 bucket 并配置访问权限
    # 推荐: gs://doris-data/production
    # gs_bucket: gs://doris-data/production
    # gs_endpoint: storage.googleapis.com
    # gs_region: us-central1
    # gs_secret_key: ""
    # gs_access_key: ""

    # S3 兼容存储配置
    # 说明: 使用 S3 兼容的对象存储 (GCS、MinIO、AWS S3 等)
    # 配置项:
    #   - obj_runtime: 对象存储运行时配置
    #   - provider: 提供商 (S3、GS、BOS、COS、OBS 等)
    #   - endpoint: 访问端点
    #   - bucket: 存储桶名称
    #   - prefix: 路径前缀
    #
    # GKE 生产配置 (使用 GCS):
    # obj_runtime:
    #   provider: GS
    #   endpoint: storage.googleapis.com
    #   bucket: doris-data-production
    #   prefix: be_data
    #   connectionpool: 32
    #   timeout: 3600
    #
    # 注意: 建议使用 Workload Identity 而不是 Secret Key

    # ========================================================================
    # RPC 端口配置
    # ========================================================================

    # Thrift 服务端口 (旧协议)
    # 说明: 已废弃，使用 BRPC
    # 默认: 9060
    # 生产建议: 默认即可
    be_port: 9060

    # BRPC 端口
    # 说明: 基于 BRPC 的 RPC 端口
    # 默认: 9050
    # 生产建议: 默认即可
    brpc_port: 9050

    # HTTP 端口
    # 说明: Web UI 和 REST API
    # 默认: 8040
    # 生产建议: 默认即可
    webserver_port: 8040

    # Heartbeat 服务端口
    # 说明: FE-BE 心跳端口
    # 默认: 9050
    # 生产建议: 默认即可
    heartbeat_service_port: 9050

    # Arrow Flight SQL 端口
    # 说明: 高速数据传输端口
    # 默认: 9070
    # 生产建议: 默认即可
    arrow_flight_sql_port: 9070

    # ========================================================================
    # 线程配置
    # ========================================================================

    # BE 工作线程数
    # 说明: 处理查询的线程数
    # 默认: -1 (CPU 核心数)
    # 生产建议: CPU 核心数
    # 注意: 太多线程增加上下文切换开销
    # 计算: num_cores * 2 或 num_cores
    num_threads: 16

    # 导入线程数
    # 说明: 处理导入的线程数
    # 默认: -1 (CPU 核心数)
    # 生产建议: CPU 核心数 / 4 或 8
    # 注意: 太多线程导致资源竞争
    import_num_threads: 8

    # 刷新线程数
    # 说明: 数据刷新到磁盘的线程数
    # 默认: -1 (CPU 核心数 / 4)
    # 生产建议: CPU 核心数 / 4
    flush_thread_num_per_store: 4

    # Segment v2 写入线程数
    # 说明: 写入 Segment v2 文件的线程数
    # 默认: 5
    # 生产建议: 5-10
    num_sstable_write_threads: 8

    # ========================================================================
    # 内存配置 - 关键配置！
    # ========================================================================

    # BE 内存限制
    # 说明: BE 进程最大内存使用
    # 默认: 0 (不限制)
    # 生产建议:
    #   - 容器环境: 设置为容器内存限制的 80%
    #   - 物理机: 设置为物理内存的 70%
    # 单位: 字节 (支持 K, M, G 后缀)
    # 示例: 64G, 128G
    # 注意: 50亿行 * 70列数据需要大内存！
    # 生产建议: 每 BE 节点 64GB+ 内存
    memory_limit: 64G

    # 读缓存大小
    # 说明: 读取数据的缓存大小
    # 默认: -1 (可用内存的 20%)
    # 生产建议: 可用内存的 20-30%
    # 注意: 影响查询性能，太小导致频繁读取磁盘
    # 生产建议: 8-16GB
    read_cache_size: 16G

    # 最小读取 buffer 大小
    # 说明: 读取数据时最小的 buffer 大小
    # 默认: 2097152 (2MB)
    # 生产建议: 2097152 - 4194304 (2-4MB)
    min_buffer_size: 2097152

    # 最大 buffer 大小
    # 说明: 读取数据时最大的 buffer 大小
    # 默认: 8388608 (8MB)
    # 生产建议: 8388608 - 16777216 (8-16MB)
    max_buffer_size: 16777216

    # 对象存储缓存大小
    # 说明: GCS/S3 读取的缓存大小
    # 默认: -1 (可用内存的 10%)
    # 生产建议: 可用内存的 10-15%
    # 注意: 影响 GCS 访问性能
    # 生产建议: 4-8GB
    obj_pool_cache_size: 8G

    # ========================================================================
    # 查询配置
    # ========================================================================

    # 单个查询超时时间 (秒)
    # 说明: 超过此时间查询自动取消
    # 默认: 300 (5分钟)
    # 生产建议: 3600-7200 (1-2小时)
    # 注意: 5亿行数据复杂查询可能需要更长
    query_timeout: 3600

    # 单个查询最大扫描行数
    # 说明: 单个查询最多扫描的行数
    # 默认: -1 (不限制)
    # 生产建议: -1
    # 注意: 可防止单个大查询占用全部资源
    max_scan_key_num: -1

    # 单个 Tablet 最大读取行数
    # 说明: 单个 Tablet 最多返回的行数
    # 默认: -1 (不限制)
    # 生产建议: -1
    # 注意: 影响大数据量查询的内存使用
    max_scan_ranges_perTablet: -1

    # ========================================================================
    # 压缩配置
    # ========================================================================

    # 压缩算法
    # 说明: 数据压缩算法
    # 可选值:
    #   - LZ4 (默认): 压缩速度最快，压缩比较低
    #   - LZ4HC: 中等压缩速度和压缩比
    #   - ZSTD: 压缩比最高，压缩速度较慢
    #   - ZLIB: 压缩比高，速度慢
    # 生产建议: ZSTD (平衡压缩比和速度)
    # 注意: 70 列数据 ZSTD 压缩率约 3-5 倍
    compression_codec: ZSTD

    # 字典编码
    # 说明: 是否启用字典编码
    # 可选值: true, false
    # 生产建议: true
    # 注意: 对低基数列效果好
    enable_dict_encoding: true

    # ========================================================================
    # 向量化执行配置
    # ========================================================================

    # 启用向量化执行
    # 说明: 是否启用向量化执行引擎
    # 可选值: true, false
    # 生产建议: true (显著提升性能，5-10倍)
    enable_vectorized_engine: true

    # 向量化执行模式
    # 说明: 向量化执行模式
    # 可选值:
    #   - auto: 自动选择
    #   - batch: 批处理模式
    #   - stream: 流处理模式
    # 生产建议: auto
    vectorized_execution_mode: auto

    # ========================================================================
    # 布鲁姆过滤器配置
    # ========================================================================

    # 布鲁姆过滤器大小
    # 说明: 布隆过滤器的 bucket 数量
    # 默认: 204800
    # 生产建议: 204800-1048576
    # 注意: 太大浪费内存，太小影响过滤效果
    bf_max_page_size: 204800

    # 稀疏索引密度
    # 说明: 稀疏索引中每个 bucket 的行数
    # 默认: 1024
    # 生产建议: 1024-4096
    # 注意: 影响范围查询性能
    sparse_page_column_max_size: 1024

    # ========================================================================
    # 写入配置
    # ========================================================================

    # Segment v2 配置
    # 说明: 是否使用 Segment v2 格式
    # 可选值: true, false
    # 生产建议: true
    # 注意: Segment v2 有更好的压缩和查询性能
    enable_segment_v2: true

    # 写入最大等待时间 (毫秒)
    # 说明: 等待写入完成的最大时间
    # 默认: 60000 (1分钟)
    # 生产建议: 60000-120000
    # 注意: 大批量导入需要更长等待时间
    write_buffer_max_time: 120000

    # 合并阈值
    # 说明: 小于该大小的文件会被合并
    # 默认: 104857600 (100MB)
    # 生产建议:
    #   - 小批次多: 104857600 (100MB)
    #   - 大批次少: 524288000 (500MB)
    # 注意: 太小产生大量小文件，太大增加资源消耗
    cum_routine_num_threads: 16

    # ========================================================================
    # 监控和日志
    # ========================================================================

    # 日志级别
    # 说明: 日志详细程度
    # 可选值: INFO, WARN, ERROR, FATAL
    # 生产建议: INFO
    log_level: INFO

    # 日志大小 (MB)
    # 说明: 单个日志文件大小
    # 默认: 200 (MB)
    # 生产建议: 200-500
    log_roll_size_mb: 200

    # 日志保留天数
    # 说明: 日志文件保留天数
    # 默认: 30
    # 生产建议: 7-30
    sys_log_dir: /opt/doris/be/log
    sys_log_verbose_modules: *
    audit_log_dir: /opt/doris/be/log

    # ========================================================================
    # GCS 访问优化配置
    # ========================================================================

    # 对象存储连接池大小
    # 说明: GCS 连接池大小
    # 默认: 16
    # 生产建议: 32-64
    # 注意: 影响并发访问 GCS 的能力
    # 20个大批次 + 1000个小批次，建议 32+
    object_pool_connectionpool_size: 32

    # 对象存储超时 (秒)
    # 说明: 对象存储操作超时时间
    # 默认: 3600
    # 生产建议: 3600-7200
    object_pool_timeout: 3600

    # GCS 预读大小
    # 说明: 读取 GCS 数据时预读的大小
    # 默认: 1048576 (1MB)
    # 生产建议: 4194304 - 16777216 (4-16MB)
    # 注意: 影响 GCS 读取效率
    gcs_reader_max_cached_bytes: 16777216
    gcs_reader_readahead_bytes: 16777216

    # ========================================================================
    # 性能优化配置
    # ========================================================================

    # Spill to disk
    # 说明: 大规模计算是否允许 spill 到磁盘
    # 可选值: true, false
    # 生产建议: true (防止内存溢出)
    enable_spilling: true

    # 聚合运算符内存限制
    # 说明: 聚合运算符的最大内存使用
    # 默认: 1073741824 (1GB)
    # 生产建议: 2147483648 - 4294967296 (2-4GB)
    # 注意: 影响 GROUP BY 性能
    agg_arena_memory_limit: 4294967296

    # 排序运算符内存限制
    # 说明: 排序运算符的最大内存使用
    # 默认: 2147483648 (2GB)
    # 生产建议: 4294967296 - 8589934592 (4-8GB)
    # 注意: 影响 ORDER BY 性能
    routine_arena_memory_limit: 8589934592

    # Join 运算符内存限制
    # 说明: Join 运算符的最大内存使用
    # 默认: 1073741824 (1GB)
    # 生产建议: 2147483648 - 4294967296 (2-4GB)
    # 注意: 影响 JOIN 性能
    join_arena_memory_limit: 4294967296

    # 数据块缓存
    # 说明: 启用数据块缓存加速查询
    # 可选值: true, false
    # 生产建议: true
    enable_data_block_cache: true

    # 数据块缓存大小
    # 说明: 数据块缓存的大小
    # 默认: 10737418240 (10GB)
    # 生产建议: 可用内存的 30-50%
    # 注意: 50亿行数据建议 20GB+
    data_block_cache_size: 21474836480

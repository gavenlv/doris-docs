# =============================================================================
# Docker Compose - Doris 本地开发环境（自定义镜像版）
# =============================================================================
#
# 用途说明：
#   使用 Docker Compose 在本地启动完整的 Doris 集群
#   与 docker-compose-doris.yaml 的区别：使用本地构建的镜像
#
# 为什么需要本地构建镜像？
#   - 需要修改 Doris 配置或添加自定义插件
#   - 在离线环境使用预构建镜像
#   - 需要调试 Doris 镜像构建过程
#   - 官方镜像不满足特定需求
#
# 架构设计：
#   宿主机
#   ┌─────────────────────────────────────────────────────────────┐
#   │  Ports 映射                                                   │
#   │  8030 → FE HTTP    9030 → FE MySQL                          │
#   │  8040 → BE HTTP    9050 → BE 心跳   8060 → BE Arrow Flight  │
#   └─────────────────────────────────────────────────────────────┘
#                               │
#                               ▼
#   ┌─────────────────────────────────────────────────────────────┐
#   │              Docker Network (默认桥接)                       │
#   │                                                             │
#   │   ┌───────────────────┐     ┌───────────────────┐        │
#   │   │     FE 容器        │     │     BE 容器        │        │
#   │   │  hostname: fe      │◄───►│  hostname: be      │        │
#   │   │  ports: 8030,9030  │     │  ports: 8040,9050  │        │
#   │   │                   │     │  8060              │        │
#   │   └───────────────────┘     └───────────────────┘        │
#   │                                                             │
#   └─────────────────────────────────────────────────────────────┘
#                               │
#                               ▼
#   ┌─────────────────────────────────────────────────────────────┐
#   │              Docker Volumes (持久化)                        │
#   │   fe_data  → /opt/doris/fe/doris-meta   (FE 元数据)       │
#   │   fe_log   → /opt/doris/fe/log         (FE 日志)          │
#   │   be_data  → /opt/doris/be/storage     (BE 数据)          │
#   │   be_tmp   → /opt/doris/tmp            (BE 临时文件)     │
#   │   be_log   → /opt/doris/be/log         (BE 日志)          │
#   └─────────────────────────────────────────────────────────────┘
#
# 组件说明：
#
#   FE (Frontend) 前端节点：
#     - 职责：SQL 解析、查询规划、查询协调、元数据管理
#     - 特点：无状态（状态存在 doris-meta 目录）
#     - 高可用：通过 BDBJE 协议实现 Leader-Follower 复制
#
#   BE (Backend) 后端节点：
#     - 职责：数据存储、查询执行、数据压缩
#     - 特点：有状态（数据存在 storage 目录）
#     - 扩容：新增 BE 后自动进行数据均衡
#
# 环境变量说明：
#
#   FE 环境变量：
#     - FE_SERVERS: FE 集群节点列表
#       格式：fe_name:host:edit_log_port
#       为什么需要？
#         - FE 集群需要知道所有节点地址
#         - 用于 Leader 选举和日志复制
#
#   BE 环境变量：
#     - BE_ADDR: BE 自身监听地址
#       为什么需要？
#         - BE 需要知道自己的地址注册到 FE
#         - FE 通过此地址下发查询任务
#
#     - FE_HOST: FE 服务地址
#       为什么需要？
#         - BE 启动时需要连接 FE 加入集群
#         - 心跳和任务下发都通过 FE_HOST
#
#     - FE_PORT: FE MySQL 端口
#       为什么需要？
#         - BE 通过 MySQL 协议与 FE 通信
#         - 注册、心跳、获取元数据都通过此端口
#
# 端口说明：
#   | 端口 | 服务  | 协议   | 用途                            |
#   |------|--------|--------|----------------------------------|
#   | 8030 | FE     | HTTP   | Web UI、REST API、健康检查      |
#   | 9030 | FE     | MySQL  | SQL 连接（客户端入口）           |
#   | 9010 | FE     | Thrift | FE-FE 通信、Leader 选举        |
#   | 8040 | BE     | HTTP   | Web UI、REST API、健康检查      |
#   | 9050 | BE     | Thrift | BE 心跳（向 FE 报告状态）       |
#   | 8060 | BE     | gRPC   | BE-BE 数据交换、Arrow Flight   |
#
# 健康检查详解：
#   为什么需要健康检查？
#     - Docker Compose 需要知道服务是否真正就绪
#     - depends_on 的 condition: service_healthy 依赖健康检查
#     - 避免 BE 在 FE 未就绪时启动导致注册失败
#
#   检查方式：
#     - 使用 curl 访问健康检查端点
#     - FE: http://127.0.0.1:8030/api/health
#     - BE: http://127.0.0.1:8040/api/health
#     - 返回 {"msg":"success"} 表示健康
#
#   参数说明：
#     - interval: 30s - 每 30 秒检查一次
#     - timeout: 5s - 等待响应超时 5 秒
#     - retries: 30 - 连续失败 30 次（约 2.5 分钟）视为不健康
#     - start_period: 30s - 容器启动后等待 30 秒再开始检查
#       为什么需要 start_period？
#         - FE/BE 启动需要时间加载配置和初始化
#         - 过早检查会误判为不健康
#
# 卷挂载详解：
#   为什么需要持久化卷？
#     - 容器删除后数据不丢失
#     - 配置和日志可以保留
#     - 方便故障排查
#
#   各卷用途：
#     - fe_data: FE 元数据
#       重要程度：★★★★★
#       内容：表结构、用户权限、分区信息等
#       丢失后果：集群无法恢复，需要重建
#
#     - fe_log: FE 日志
#       重要程度：★★☆☆☆
#       内容：FE 运行日志、错误日志
#       用途：故障排查
#
#     - be_data: BE 数据
#       重要程度：★★★★☆
#       内容：实际存储的数据
#       丢失后果：数据丢失，但集群可继续运行
#
#     - be_tmp: BE 临时文件
#       重要程度：★☆☆☆☆
#       内容：查询中间结果
#       丢失后果：当前查询失败，无持久影响
#
#     - be_log: BE 日志
#       重要程度：★★☆☆☆
#       内容：BE 运行日志
#       用途：故障排查
#
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # FE (Frontend) 前端服务
  # ===========================================================================
  # FE 职责：
  #   1. SQL 解析和重写
  #   2. 查询规划和优化
  #   3. 查询调度和协调
  #   4. 元数据管理（库表结构、用户权限）
  #   5. 集群管理（BE 心跳管理）
  #
  # 为什么 FE 是无状态的？
  #   - 元数据存储在 BDBJE 数据库（doris-meta 目录）
  #   - 任何 FE 都可以从磁盘加载完整元数据
  #   - 客户端可以连接任意 FE
  #
  fe:
    # 镜像选择：
    #   - apache/doris:fe-{VERSION} 官方镜像
    #   - VERSION 需要与 BE 保持一致
    #   - 本地构建版本：doris-fe:{VERSION}
    image: apache/doris:fe-3.1.4

    # 容器名称作用：
    #   - docker ps 时显示的名字
    #   - 网络中作为 hostname 使用
    container_name: doris-fe

    # 主机名作用：
    #   - 容器内部的 hostname
    #   - 用于容器间通信
    #   - 必须与 FE_SERVERS 配置中的名称一致
    hostname: fe

    # 环境变量配置：
    #   FE_SERVERS: 定义 FE 集群的所有节点
    #   格式：fe_name:host:edit_log_port
    #   为什么需要？
    #     - FE 集群使用 BDBJE 协议同步元数据
    #     - 需要知道所有 Follower 的地址
    #     - 用于 Leader 选举
    environment:
      - FE_SERVERS=fe1:127.0.0.1:9010

    # 端口映射：
    #   格式：宿主机端口:容器端口
    #   为什么需要端口映射？
    #     - 宿主机需要访问容器内的服务
    #     - 8030: Web UI（浏览器访问）
    #     - 9030: MySQL 协议（SQL 客户端连接）
    ports:
      - "8030:8030"  # FE HTTP - Web UI
      - "9030:9030"  # FE MySQL - SQL 连接

    # 卷挂载：
    #   格式：宿主机卷:容器挂载点
    #   为什么挂载这些目录？
    #     - doris-meta: 元数据必须持久化
    #     - log: 日志方便宿主机查看
    volumes:
      - fe_data:/opt/doris/fe/doris-meta  # 元数据目录
      - fe_log:/opt/doris/fe/log           # 日志目录

    # 健康检查：
    #   作用：确保 FE 完全启动后再启动 BE
    #   为什么重要？
    #     - BE 启动时需要连接 FE
    #     - 如果 FE 未就绪，BE 注册会失败
    #     - 使用 healthcheck 确保依赖顺序
    healthcheck:
      # 检测命令：
      #   curl -s http://127.0.0.1:8030/api/health
      #   -s: silent 模式，不显示进度
      #   返回 {"msg":"success"} 表示健康
      test: ["CMD", "bash", "-c", "curl -s http://127.0.0.1:8030/api/health"]
      interval: 10s      # 每 10 秒检查
      timeout: 5s        # 5 秒无响应视为失败
      retries: 30        # 重试 30 次（约 5 分钟）
      start_period: 30s  # 启动后 30 秒开始检查

  # ===========================================================================
  # BE (Backend) 后端服务
  # ===========================================================================
  # BE 职责：
  #   1. 数据存储（列式存储）
  #   2. 数据压缩
  #   3. 查询执行
  #   4. 数据写入
  #
  # 为什么 BE 是有状态的？
  #   - 实际业务数据存储在 BE
  #   - 数据以 Tablet 为单位分片存储
  #   - 新增 BE 需要进行数据均衡
  #
  be:
    image: apache/doris:be-3.1.4
    container_name: doris-be
    hostname: be

    # BE 环境变量详解：
    #
    # BE_ADDR - BE 自身监听地址
    #   为什么需要显式指定？
    #     - 默认使用容器内部 IP（容器间通信用）
    #     - 但这个 IP 是 Docker 分配的，不固定
    #     - 显式指定保证 FE 能稳定找到 BE
    #   注意：生产环境需要指定实际网卡 IP
    environment:
      - BE_ADDR=127.0.0.1:9050

      # FE_HOST - FE 服务地址
      #   为什么需要？
      #     - BE 启动时主动连接 FE
      #     - 注册自己到 FE 的集群
      #     - 心跳和任务下发都通过 FE
      - FE_HOST=127.0.0.1

      # FE_PORT - FE MySQL 端口
      #   为什么是 9030？
      #     - MySQL 端口用于 BE-FE 通信
      #     - BE 通过此端口注册和发送心跳
      - FE_PORT=9030

    ports:
      - "8040:8040"  # BE HTTP - Web UI
      - "9050:9050"  # BE Heartbeat - 心跳端口
      - "8060:8060"  # BE Arrow Flight - 高速数据传输

    volumes:
      - be_data:/opt/doris/be/storage  # 数据目录
      - be_tmp:/opt/doris/tmp          # 临时目录
      - be_log:/opt/doris/be/log       # 日志目录

    # 依赖配置：
    #   depends_on 确保 FE 先启动
    #   condition: service_healthy 确保 FE 健康检查通过
    #   为什么需要健康检查？
    #     - depends_on 只保证容器启动顺序
    #     - 不保证服务真正可用
    #     - BE 需要 FE 完全就绪才能注册
    depends_on:
      fe:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://127.0.0.1:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

# =============================================================================
# 卷定义 (Volumes)
# =============================================================================
# 使用命名卷的好处：
#   1. Docker 管理卷，权限设置简单
#   2. 跨平台兼容（Windows/Mac/Linux）
#   3. 备份和迁移方便
#   4. 可以设置只读挂载等高级选项
#
volumes:
  fe_data:  # FE 元数据
    # 实际挂载到容器的 /opt/doris/fe/doris-meta
    # 重要：元数据丢失集群无法恢复

  fe_log:   # FE 日志
    # 实际挂载到容器的 /opt/doris/fe/log
    # 包含 info、warn、error 日志

  be_data:  # BE 数据
    # 实际挂载到容器的 /opt/doris/be/storage
    # 存储实际业务数据

  be_tmp:   # BE 临时文件
    # 实际挂载到容器的 /opt/doris/tmp
    # 查询中间结果，重启后清空

  be_log:   # BE 日志
    # 实际挂载到容器的 /opt/doris/be/log
    # 包含 be.out、be.INFO 等日志

# =============================================================================
# 使用方法详解
# =============================================================================

# 启动集群：
# $ docker-compose -f docker-compose-local.yaml up -d
#   -d: detached 模式，后台运行
#
# 为什么不自动构建镜像？
#   - 需要先构建：docker build -t doris-fe:3.1.4 -f docker/fe/Dockerfile .
#   - 需要先构建：docker build -t doris-be:3.1.4 -f docker/be/Dockerfile .
#   - 然后修改 image: 为本地镜像名

# 查看日志：
# $ docker-compose -f docker-compose-local.yaml logs -f
#   -f: follow 模式，实时查看
# $ docker-compose logs -f fe  # 只看 FE 日志
# $ docker logs doris-fe        # 使用容器名查看

# 查看容器状态：
# $ docker-compose -f docker-compose-local.yaml ps
# $ docker ps | grep doris

# 连接集群：
# $ mysql -h127.0.0.1 -P9030 -uroot
#   - -uroot: root 用户
#   - 默认无密码
#   - 127.0.0.1 而非 localhost，避免 socket 连接问题

# 查看集群状态：
# mysql> SHOW FRONTENDS;        # 查看 FE 状态
# mysql> SHOW BACKENDS;         # 查看 BE 状态
# mysql> SHOW PROC '/frontends'; # 详细 FE 信息
# mysql> SHOW PROC '/backends';  # 详细 BE 信息

# 访问 Web UI：
# FE: http://localhost:8030
# BE: http://localhost:8040

# 停止集群：
# $ docker-compose -f docker-compose-local.yaml stop
#   停止但不删除容器

# 启动已停止的集群：
# $ docker-compose -f docker-compose-local.yaml start

# 完全删除集群：
# $ docker-compose -f docker-compose-local.yaml down
#   删除容器，但保留卷（数据还在）

# 清理数据（谨慎！）：
# $ docker-compose -f docker-compose-local.yaml down -v
#   -v: 同时删除卷，所有数据丢失
#   适用于：重新开始、测试环境清理

# 进入容器调试：
# $ docker exec -it doris-fe bash
# $ docker exec -it doris-be bash

# 查看资源使用：
# $ docker stats
#   查看 CPU、内存、网络使用

# =============================================================================
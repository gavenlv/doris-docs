# =============================================================================
# MinIO 部署配置
# =============================================================================
# 作用: S3 兼容对象存储，用于 Doris 存算分离架构的数据存储
# 版本: minio/minio:latest
#
# 架构说明:
#   MinIO 提供 S3 兼容 API，Doris BECN 通过 S3 协议访问数据
#   数据不存储在 BECN 本地，而是存储在 MinIO 中
#
# 前置条件:
#   - MinIO 镜像已加载: minio/minio:latest 或 minio/minio:RELEASE.2024-01-16T16-07-38Z
# =============================================================================

---
# MinIO StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris-disagg
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: doris-disagg
    spec:
      containers:
        - name: minio
          # 使用本地镜像
          image: minio/minio:latest
          imagePullPolicy: Never
          command:
            - minio
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            # MinIO root credentials
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi

---
# MinIO Headless Service
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris-disagg
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
# MinIO NodePort Service (for console access)
apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris-disagg
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 30000
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30001
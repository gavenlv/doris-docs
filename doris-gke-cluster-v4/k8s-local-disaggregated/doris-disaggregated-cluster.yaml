# =============================================================================
# DorisDisaggregatedCluster 配置
# =============================================================================
# 作用: 定义完整的存算分离 Doris 集群
# 版本: Doris 4.0.4
# CRD: doris.apache.com/v1
#
# 架构说明:
#   ┌─────────────────────────────────────────────────────────────┐
#   │              DorisDisaggregatedCluster                      │
#   │                                                             │
#   │  ┌──────────┐   ┌──────────┐   ┌──────────┐               │
#   │  │    FE    │   │    FE    │   │    FE    │  (3 副本)     │
#   │  │ Frontend │◄──│ Frontend │◄──│ Frontend │  (Query)     │
#   │  └────┬─────┘   └────┬─────┘   └────┬─────┘               │
#   │       │              │              │                       │
#   │       └──────────────┼──────────────┘                       │
#   │                      ▼                                      │
#   │               ┌────────────┐                               │
#   │               │MetaService │ (3 副本)                      │
#   │               │ (FDB 存储) │                               │
#   │               └─────┬──────┘                               │
#   │                     │                                       │
#   │       ┌─────────────┼─────────────┐                        │
#   │       ▼             ▼             ▼                        │
#   │  ┌──────────┐ ┌──────────┐ ┌──────────┐                    │
#   │  │   BECN   │ │   BECN   │ │   BECN   │  (N 副本)       │
#   │  │ Compute  │ │ Compute  │ │ Compute  │  (仅计算)       │
#   │  │   Node   │ │   Node   │ │   Node   │                   │
#   │  └────┬─────┘ └────┬─────┘ └────┬─────┘                   │
#   │       │            │            │                           │
#   │       └────────────┼────────────┘                           │
#   │                    ▼                                        │
#   │               ┌────────────┐                               │
#   │               │   MinIO    │  (S3 兼容对象存储)            │
#   │               └────────────┘                               │
#   └─────────────────────────────────────────────────────────────┘
#
# 组件职责:
#   FE (Frontend): SQL 解析、查询规划、查询协调、元数据管理
#   MetaService: 存储层元数据 (Tablet 位置、副本信息)
#   BECN (Backend Compute Node): 数据计算，不存储数据
#   MinIO: 数据持久化存储
#   FoundationDB: MetaService 的元数据存储
# =============================================================================

apiVersion: doris.apache.com/v1
kind: DorisDisaggregatedCluster
metadata:
  name: doris-disagg-cluster
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/managed-by: doris-operator
    app.kubernetes.io/part-of: doris-disagg
    doris-version: "4.0.4"
spec:
  # ---------------------------------------------------------------------------
  # 集群管理凭证
  # ---------------------------------------------------------------------------
  adminUser:
    name: root

  # ---------------------------------------------------------------------------
  # FE 配置 - Frontend 节点
  # ---------------------------------------------------------------------------
  fe:
    replicas: 3
    # Doris 4.0.4 镜像
    image: apache/doris:4.0.4-secure
    imagePullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 2
        memory: 8Gi
      limits:
        cpu: 4
        memory: 16Gi

    # 存储配置
    storageClassName: standard
    storageSize: 50Gi

    # 服务配置
    service:
      type: NodePort
      ports:
        - name: query-port
          port: 9030
          targetPort: 9030
        - name: http-port
          port: 8030
          targetPort: 8030
        - name: rpc-port
          port: 9010
          targetPort: 9010

    # 探针配置
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 5
      successThreshold: 3
      timeoutSeconds: 5

    startupProbe:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 30

    # 环境变量
    env:
      - name: JAVA_OPTS
        value: "-Xmx8g -Xms4g -XX:+UseG1GC"

    # Pod 反亲和性
    affinity:
      podAntiAffinity:
        type: PreferNoSchedule

  # ---------------------------------------------------------------------------
  # BECN 配置 - Backend Compute Node (计算节点，仅做计算)
  # ---------------------------------------------------------------------------
  becn:
    replicas: 3
    # Doris 4.0.4 镜像
    image: apache/doris:4.0.4-secure
    imagePullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 4
        memory: 16Gi
      limits:
        cpu: 8
        memory: 32Gi

    # 本地缓存存储 (用于热数据缓存)
    storageClassName: standard
    storageSize: 100Gi

    # 服务配置
    service:
      type: ClusterIP
      ports:
        - name: be-port
          port: 9060
          targetPort: 9060
        - name: brpc-port
          port: 9050
          targetPort: 9050
        - name: webserver-port
          port: 8040
          targetPort: 8040
        - name: heartbeat-service-port
          port: 9050
          targetPort: 9050
        - name: arrow-flight-sql-port
          port: 9070
          targetPort: 9070

    # 探针配置
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 5
      successThreshold: 3
      timeoutSeconds: 5

    startupProbe:
      initialDelaySeconds: 300
      periodSeconds: 10
      failureThreshold: 60

    # 环境变量
    env:
      - name: JAVA_OPTS
        value: "-Xmx16g -Xms8g -XX:+UseG1GC"

    # 反亲和性
    affinity:
      podAntiAffinity:
        type: PreferNoSchedule

  # ---------------------------------------------------------------------------
  # MetaService 配置 - 元数据服务
  # ---------------------------------------------------------------------------
  metaService:
    replicas: 3
    # Doris 4.0.4 镜像 (包含 MetaService)
    image: apache/doris:4.0.4-secure
    imagePullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 2
        memory: 4Gi
      limits:
        cpu: 4
        memory: 8Gi

    # 配置: 引用 FDB 集群生成的 ConfigMap
    fdbConfigMapNamespaceName:
      name: fdb-cluster-config
      namespace: foundationdb

    # 存储配置
    storageClassName: standard
    storageSize: 10Gi

    # 服务配置
    service:
      type: ClusterIP
      ports:
        - name: brpc
          port: 5000
          targetPort: 5000

    # 探针配置
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 3

    startupProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      failureThreshold: 30

    # 存活超时
    liveTimeout: 30
    # 启动超时
    startTimeout: 120

  # ---------------------------------------------------------------------------
  # 对象存储配置 - S3 兼容存储 (MinIO)
  # ---------------------------------------------------------------------------
  storage:
    # 存储类型: S3 (兼容 MinIO)
    type: S3

    # Bucket 名称
    bucket: doris-data

    # MinIO Service 地址
    endpoint: "http://minio.foundationdb.svc.cluster.local:9000"

    # Region
    region: us-east-1

    # 访问密钥 (引用 Secret)
    credential:
      secretRef: minio-credential

    # 路径前缀
    prefix: be_data

  # ---------------------------------------------------------------------------
  # 全局配置
  # ---------------------------------------------------------------------------
  global:
    # 镜像拉取策略
    imagePullSecrets:
      - name: doris-registry

    # 容忍
    tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 60

  # ---------------------------------------------------------------------------
  # 故障恢复配置
  # ---------------------------------------------------------------------------
  recovery:
    enabled: true
    maxRetry: 5
    retryInterval: 10m

  # ---------------------------------------------------------------------------
  # 升级策略
  # ---------------------------------------------------------------------------
  upgradePolicy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
    timeout: 30m

  # ---------------------------------------------------------------------------
  # 日志配置
  # ---------------------------------------------------------------------------
  logging:
    level: INFO
    retention: 7
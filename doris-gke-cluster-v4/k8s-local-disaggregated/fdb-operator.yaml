# =============================================================================
# FoundationDB Kubernetes Operator 部署配置
# =============================================================================
# 作用: 管理 FoundationDB 集群的生命周期
# 版本: fdb-kubernetes-operator 1.12.0 + foundationdb 7.1.37
# Doris 版本: 4.0.4
#
# 前置条件:
#   - Kubernetes 1.26+
#   - FDB 镜像已加载到本地 (foundationdb/foundationdb:7.1.37)
#   - fdb-kubernetes-operator 镜像已加载 (fdb-kubernetes-operator:1.12.0)
#
# 部署顺序:
#   kubectl apply -f fdb-operator.yaml
# =============================================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/managed-by: kubectl

---
# ServiceAccount: FDB Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator

---
# ClusterRole: FDB Operator 权限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
rules:
  # 管理 Deployments
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # 管理 StatefulSets
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  # 管理 ConfigMaps, Pods, Services 等
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - pods
      - pods/exec
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  # 管理 Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  # 管理 FoundationDB CRDs
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters
      - foundationdbbackups
      - foundationdbrestores
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters/status
      - foundationdbclusters/finalizers
      - foundationdbbackups/status
      - foundationdbbackups/finalizers
      - foundationdbrestores/status
      - foundationdbrestores/finalizers
    verbs:
      - get
      - update
      - patch
  # 管理 Leases (用于领导者选举)
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # 查看 CRDs
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  # 管理 PodDisruptionBudgets
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
roleRef:
  kind: ClusterRole
  name: foundationdb-kubernetes-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: foundationdb-kubernetes-operator
    namespace: foundationdb

---
# Deployment: FDB Kubernetes Operator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foundationdb
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundationdb
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: foundationdb-kubernetes-operator
      containers:
        - name: operator
          # 注意: 需要本地镜像 fdb-kubernetes-operator:1.12.0
          image: fdb-kubernetes-operator:1.12.0
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            # FDB 集群使用的镜像
            - name: FDB_KUBERNETES_OPERATOR_IMAGE
              value: foundationdb/foundationdb:7.1.37
            # 初始化容器使用的镜像
            - name: FDB_KUBERNETES_INIT_IMAGE
              value: foundationdb/foundationdb:7.1.37
            # 日志配置
            - name: FDB_POD_LOG_GROUP
              value: foundationdb
            - name: LOG_LEVEL
              value: INFO
            - name: FDB_POD_LOG_LEVEL
              value: INFO
            # 禁用 Pod 级别日志
            - name: FDB_DISABLE_POD_LEVEL_LOGGING
              value: "false"
            # 使用统一镜像模式
            - name: FDB_IMAGE_TYPE
              value: unified
            # 本地镜像不需要拉取
            - name: FDB_IMAGE_PULL_POLICY
              value: Never
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
# =============================================================================
# Horizontal Pod Autoscaler 配置
# =============================================================================
# 作用: 为 Doris 组件提供自动扩容能力
#
# 说明:
#   - FE: 基于 CPU 和内存使用率自动扩容
#   - BECN: 基于 CPU 使用率自动扩容
#
# 前置条件:
#   - metrics-server 已安装
#   - kubectl top 命令可用
# =============================================================================

---
# FE HPA - Frontend 自动扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doris-fe-hpa
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe
    app.kubernetes.io/part-of: doris-disagg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doris-fe
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # CPU 使用率
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 内存使用率
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
# BECN HPA - Backend Compute Node 自动扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doris-becn-hpa
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: becn
    app.kubernetes.io/part-of: doris-disagg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doris-becn
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # CPU 使用率
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 内存使用率
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 3
          periodSeconds: 15
      selectPolicy: Max

---
# MetaService HPA - 元数据服务自动扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doris-metaservice-hpa
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: meta-service
    app.kubernetes.io/part-of: doris-disagg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doris-metaservice
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # CPU 使用率
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # 内存使用率
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
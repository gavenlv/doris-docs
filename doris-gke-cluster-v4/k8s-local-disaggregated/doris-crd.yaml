apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dorisclusters.doris.apache.com
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: operator
spec:
  group: doris.apache.com
  names:
    kind: DorisCluster
    listKind: DorisClusterList
    plural: dorisclusters
    singular: doriscluster
    shortNames:
      - dcr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                dorisVersion:
                  type: string
                feSpec:
                  type: object
                  properties:
                    replicas:
                      type: integer
                    image:
                      type: string
                    imagePullPolicy:
                      type: string
                    resources:
                      type: object
                    storage:
                      type: object
                    configMapInfo:
                      type: object
                    service:
                      type: object
                    env:
                      type: array
                      items:
                        type: object
                    affinity:
                      type: object
                beSpec:
                  type: object
                  properties:
                    replicas:
                      type: integer
                    image:
                      type: string
                    imagePullPolicy:
                      type: string
                    resources:
                      type: object
                    storage:
                      type: object
                    configMapInfo:
                      type: object
                    service:
                      type: object
                    env:
                      type: array
                      items:
                        type: object
                    affinity:
                      type: object
                brokerSpec:
                  type: object
                cnSpec:
                  type: object
            status:
              type: object


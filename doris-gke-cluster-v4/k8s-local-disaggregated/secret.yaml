# =============================================================================
# Secret 配置
# =============================================================================
# 作用: 存储敏感信息
#
# 内容:
#   - MinIO 访问凭证
#   - Doris 管理员密码
# =============================================================================

---
# MinIO 访问凭证
apiVersion: v1
kind: Secret
metadata:
  name: minio-credential
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris-disagg
    doris-version: "4.0.4"
type: Opaque
stringData:
  # MinIO 访问密钥 (base64 编码)
  accessKey: minioadmin
  secretKey: minioadmin

---
# Doris 管理员密码
apiVersion: v1
kind: Secret
metadata:
  name: doris-admin-secret
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: admin
    app.kubernetes.io/part-of: doris-disagg
    doris-version: "4.0.4"
type: Opaque
stringData:
  # Doris root 密码
  password: root123456
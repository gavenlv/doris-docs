# =============================================================================
# FoundationDB CRD 定义
# =============================================================================
# 来源: https://github.com/FoundationDB/fdb-kubernetes-operator/config/crd/bases
# 版本: v1beta2
# =============================================================================

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationdbclusters.apps.foundationdb.org
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: fdb-operator
spec:
  group: apps.foundationdb.org
  names:
    kind: FoundationDBCluster
    listKind: FoundationDBClusterList
    plural: foundationdbclusters
    singular: foundationdbcluster
    shortNames:
      - fdb
      - fdbcluster
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                version:
                  type: string
                image:
                  type: string
                instanceIDSource:
                  type: string
                podBuildMetadata:
                  type: object
                mainContainer:
                  type: object
                sidecarContainer:
                  type: object
                trustedCertificates:
                  type: object
                kustomizeConfig:
                  type: object
                faultDomain:
                  type: object
                dataCenter:
                  type: string
                databaseConfiguration:
                  type: object
                processCounts:
                  type: object
                podLabelConfig:
                  type: object
                resources:
                  type: object
                nodeSelector:
                  type: object
                priorityClassName:
                  type: string
                tolerations:
                  type: array
                  items:
                    type: object
                services:
                  type: object
                storageClass:
                  type: string
                storageDefinition:
                  type: object
                persistentVolumeClaimSpec:
                  type: object
                volumeClaimSpec:
                  type: object
                enableTLS:
                  type: boolean
                tlsSecretRef:
                  type: string
                KvReplicatorImage:
                  type: string
                logGroup:
                  type: string
                logLevel:
                  type: string
                noiseLevel:
                  type: string
                exportMetrics:
                  type: boolean
                metricsPrefix:
                  type: string
                sidecarVariables:
                  type: object
                initContainers:
                  type: object
                containers:
                  type: object
                selector:
                  type: object
                topology:
                  type: object
                routing:
                  type: object
                minimumUptimeSecondsBeforeRestart:
                  type: integer
                killProcesses:
                  type: boolean
                skip:
                  type: boolean
                autoResolve:
                  type: boolean
                removeProcesses:
                  type: array
                  items:
                    type: string
              status:
                type: object
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationdbbackups.apps.foundationdb.org
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: fdb-operator
spec:
  group: apps.foundationdb.org
  names:
    kind: FoundationDBBackup
    listKind: FoundationDBBackupList
    plural: foundationdbbackups
    singular: foundationdbbackup
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
            status:
              type: object
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationdbrestores.apps.foundationdb.org
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: fdb-operator
spec:
  group: apps.foundationdb.org
  names:
    kind: FoundationDBRestore
    listKind: FoundationDBRestoreList
    plural: foundationdbrestores
    singular: foundationdbrestore
  scope: Namespaced
  versions:
    - name: v1beta2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
            status:
              type: object
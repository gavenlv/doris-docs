apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: doris
  labels:
    app: doris
    component: fe
spec:
  type: ClusterIP
  ports:
    - port: 8030
      name: fe-http
    - port: 9030
      name: fe-mysql
    - port: 9010
      name: fe-rep
  selector:
    app: doris
    component: fe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-fe
  namespace: doris
  labels:
    app: doris
    component: fe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: doris
      component: fe
  template:
    metadata:
      labels:
        app: doris
        component: fe
    spec:
      imagePullSecrets:
        - name: nexus-secret
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /opt/doris"]
          volumeMounts:
            - name: data
              mountPath: /opt/doris
      containers:
        - name: fe
          image: nexus.company.com:8082/doris/fe:2.1.7-secure
          imagePullPolicy: Always
          ports:
            - containerPort: 8030
              name: fe-http
            - containerPort: 9030
              name: fe-mysql
            - containerPort: 9010
              name: fe-rep
          env:
            - name: FE_SERVERS
              value: "fe1:9010,fe2:9010,fe3:9010"
            - name: FE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - name: data
              mountPath: /opt/doris/fe/doris-meta
            - name: log
              mountPath: /opt/doris/fe/log
          startupProbe:
            httpGet:
              path: /api/health
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8030
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: log
          emptyDir: {}

# =============================================================================
# Doris BE 本地 K8s 部署配置 (Docker Desktop)
# =============================================================================
#
# 用途：使用传统 Deployment 方式在本地 K8s 部署 BE
#
# 注意：这是旧版配置，推荐使用 k8s-local/ 目录下的 DorisCluster 方式
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: doris-be
  namespace: doris
  labels:
    app: doris
    component: be
spec:
  type: NodePort
  ports:
    - port: 8040
      name: be-http
      targetPort: 8040
    - port: 9050
      name: be-heartbeat
      targetPort: 9050
    - port: 8060
      name: be-arrow-flight
      targetPort: 8060
  selector:
    app: doris
    component: be

---
# =============================================================================
# Deployment: BE 部署
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-be
  namespace: doris
  labels:
    app: doris
    component: be
spec:
  replicas: 1            # 本地开发使用单副本
  selector:
    matchLabels:
      app: doris
      component: be

  template:
    metadata:
      labels:
        app: doris
        component: be

    spec:
      containers:
        - name: be
          image: apache/doris:be-3.1.4

          ports:
            - containerPort: 8040
              name: be-http
            - containerPort: 9050
              name: be-heartbeat
            - containerPort: 8060
              name: be-arrow-flight

          env:
            # BE 监听地址
            - name: BE_ADDR
              value: "0.0.0.0:9050"

            # FE 主机地址（K8s 服务名）
            - name: FE_HOST
              value: "127.0.0.1"   # 本地开发使用 IP

            # FE MySQL 端口
            - name: FE_PORT
              value: "9030"

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: data
              mountPath: /opt/doris/be/storage
            - name: be-tmp
              mountPath: /opt/doris/tmp
            - name: log
              mountPath: /opt/doris/be/log

          startupProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 60
            periodSeconds: 30

      volumes:
        - name: data
          emptyDir: {}
        - name: be-tmp
          emptyDir: {}
        - name: log
          emptyDir: {}

# =============================================================================
# 重要说明
# =============================================================================
#
# 本地开发注意事项：
# 1. FE 和 BE 必须能相互通信
# 2. 本地环境可能需要调整 FE_HOST
# 3. 临时目录用于导入等操作的中间文件
#
# 端口说明：
# | 端口 | 用途 |
# |------|------|
# | 8040 | BE Web UI、监控 |
# | 9050 | BE 心跳（与 FE 通信）|
# | 8060 | Arrow Flight SQL |
#
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: doris-be
  namespace: doris
  labels:
    app: doris
    component: be
spec:
  type: NodePort
  ports:
    - port: 8040
      name: be-http
      targetPort: 8040
    - port: 9050
      name: be-heartbeat
      targetPort: 9050
    - port: 8060
      name: be-arrow-flight
      targetPort: 8060
  selector:
    app: doris
    component: be
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-be
  namespace: doris
  labels:
    app: doris
    component: be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doris
      component: be
  template:
    metadata:
      labels:
        app: doris
        component: be
    spec:
      containers:
        - name: be
          image: apache/doris:be-3.1.4
          ports:
            - containerPort: 8040
              name: be-http
            - containerPort: 9050
              name: be-heartbeat
            - containerPort: 8060
              name: be-arrow-flight
          env:
            - name: BE_ADDR
              value: "0.0.0.0:9050"
            - name: FE_HOST
              value: "127.0.0.1"
            - name: FE_PORT
              value: "9030"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /opt/doris/be/storage
            - name: be-tmp
              mountPath: /opt/doris/tmp
            - name: log
              mountPath: /opt/doris/be/log
          startupProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8040
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: be-tmp
          emptyDir: {}
        - name: log
          emptyDir: {}

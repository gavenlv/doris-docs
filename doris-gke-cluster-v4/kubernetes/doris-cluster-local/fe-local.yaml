apiVersion: v1
kind: Namespace
metadata:
  name: doris
  labels:
    name: doris
---
apiVersion: v1
kind: Service
metadata:
  name: doris-fe
  namespace: doris
  labels:
    app: doris
    component: fe
spec:
  type: NodePort
  ports:
    - port: 8030
      name: fe-http
      targetPort: 8030
    - port: 9030
      name: fe-mysql
      targetPort: 9030
    - port: 9010
      name: fe-rep
      targetPort: 9010
  selector:
    app: doris
    component: fe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-fe
  namespace: doris
  labels:
    app: doris
    component: fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doris
      component: fe
  template:
    metadata:
      labels:
        app: doris
        component: fe
    spec:
      containers:
        - name: fe
          image: apache/doris:fe-3.1.4
          ports:
            - containerPort: 8030
              name: fe-http
            - containerPort: 9030
              name: fe-mysql
            - containerPort: 9010
              name: fe-rep
          env:
            - name: FE_SERVERS
              value: "fe1:127.0.0.1:9010"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /opt/doris/fe/doris-meta
            - name: log
              mountPath: /opt/doris/fe/log
          startupProbe:
            tcpSocket:
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8030
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8030
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: log
          emptyDir: {}

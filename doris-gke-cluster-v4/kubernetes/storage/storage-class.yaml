# =============================================================================
# GKE StorageClass 和 PVC 配置
# =============================================================================
#
# StorageClass 作用：
# - 定义存储的类型和提供者
# - GKE 使用 GCE Persistent Disk
# - 支持 SSD 和 Standard 两种类型
#
# PVC 作用：
# - 声明需要多少存储空间
# - K8s 根据 StorageClass 自动创建 PV
# =============================================================================

# -----------------------------------------------------------------------------
# StorageClass: Doris 存储类
# -----------------------------------------------------------------------------
# GCE PD 类型：
# - pd-standard: 标准硬盘，成本低
# - pd-ssd: SSD硬盘，性能高
#
# replication-type:
# - regional-pd: 区域复制，高可用
# - 空: 单区域存储

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: doris-storage
  namespace: doris
provisioner: pd.csi.storage.gke.io
parameters:
  # 磁盘类型：pd-standard (标准) 或 pd-ssd (SSD)
  type: pd-standard
  # 区域复制：高可用，数据存储在两个区域
  replication-type: regional-pd
volumeBindingMode: WaitForFirstConsumer  # 等待 Pod 调度后绑定
allowVolumeExpansion: true               # 允许在线扩容
reclaimPolicy: Retain                    # Retain 防止误删

---
# -----------------------------------------------------------------------------
# FE Metadata PVC
# -----------------------------------------------------------------------------
# 元数据存储：表结构、用户信息等
# 元数据丢失会导致集群不可用

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doris-fe-meta
  namespace: doris
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: doris-storage
  resources:
    requests:
      storage: 100Gi

---
# -----------------------------------------------------------------------------
# BE Storage PVC
# -----------------------------------------------------------------------------
# 数据存储：实际业务数据

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: doris-be-storage
  namespace: doris
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: doris-storage
  resources:
    requests:
      storage: 500Gi

# =============================================================================
# 存储容量规划
# =============================================================================
#
# 开发测试：
# - FE Meta: 50Gi
# - BE Storage: 200Gi
#
# 预生产：
# - FE Meta: 100Gi
# - BE Storage: 500Gi
#
# 生产：
# - FE Meta: 200Gi+
# - BE Storage: 1Ti+
#
# =============================================================================

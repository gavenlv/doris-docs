# =============================================================================
# Doris 镜像构建配置
# =============================================================================
#
# 用途：定义 Doris 镜像的构建参数
#
# 为什么需要这个配置？
# - 统一管理版本号
# - 配置构建参数
# - 定义安全设置
# =============================================================================

# Doris 版本配置
doris:
  # Doris 版本号
  # 支持版本：2.0.x, 2.1.x, 3.0.x
  version: "2.1.7"

  # 下载地址
  # - 阿里云 OSS（官方加速）
  # - Apache 官方
  # - 清华镜像
  download_url: "https://apache-doris-releases.oss-accelerate.aliyuncs.com"

# 镜像构建配置
build:
  # 基础镜像
  base_image: "ubuntu:22.04"

  # 构建参数（传递给 Docker build）
  args:
    # Doris 版本（与上面的 version 保持一致）
    DORIS_VERSION: "2.1.7"

    # Java 版本（Doris FE 需要）
    JAVA_VERSION: "11"

  # 安全配置
  security:
    # 是否以非 root 用户运行
    # 生产镜像应设为 true
    run_as_non_root: true

    # 是否只安装最小包
    # 生产镜像应设为 true
    minimal_base: true

    # 是否启用安全扫描（Trivy）
    # 生产镜像应设为 true
    scan_enabled: true

# 镜像命名
images:
  fe: "doris-fe"           # FE 镜像基础名
  be: "doris-be"           # BE 镜像基础名
  fdb: "foundationdb"      # FoundationDB 镜像

# 镜像仓库配置
registry:
  # 本地仓库（测试用）
  local: "localhost:5000"

  # 远程私有仓库（生产用）
  remote: "nexus.company.com:8082"

# =============================================================================
# 版本说明
# =============================================================================
#
# Doris 版本选择建议：
# - 2.0.x: 稳定版本，适合生产
# - 2.1.x: 最新稳定版本，功能更多
# - 3.0.x: 最新版本，可能有 breaking changes
#
# 各版本特点：
# - 2.0: 成熟稳定
# - 2.1: 性能优化，资源隔离增强
# - 3.0: 全新架构，存算分离
#
# =============================================================================

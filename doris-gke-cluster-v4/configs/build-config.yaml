# =============================================================================
# Doris 镜像构建配置
# =============================================================================
#
# 用途说明：
#   统一管理 Doris 镜像构建的所有参数
#
# 为什么需要这个配置文件？
#   1. 统一版本管理
#      - 避免 Dockerfile 和脚本中硬编码版本号
#      - 修改版本只需改一处
#
#   2. 标准化构建流程
#      - 定义统一的构建参数
#      - 确保不同环境构建结果一致
#
#   3. 灵活切换镜像源
#      - 支持官方源、镜像加速源
#      - 便于离线环境配置
#
#   4. 安全合规
#      - 配置安全扫描
#      - 定义非 root 运行
#
# 配置使用场景：
#   - scripts/build-images.sh: 读取此配置构建镜像
#   - Dockerfile: 通过 --build-arg 接收参数
#   - CI/CD: 集成到自动化流水线
#
# =============================================================================

# -----------------------------------------------------------------------------
# Doris 版本配置
# -----------------------------------------------------------------------------
# 为什么需要版本配置？
#   - Doris 不同版本可能不兼容
#   - FE 和 BE 必须使用相同主版本
#   - 便于回滚和升级
#
doris:
  # Doris 版本号
  # 支持的版本格式：4.0.x
  #
  # 版本选择建议：
  #   - 4.0.x: 当前稳定版本，支持存算分离
  #
  # 重要：升级前请查阅官方升级文档！
  version: "4.0.4"

  # 下载地址配置
  # 为什么支持多个地址？
  #   - 阿里云 OSS: 国内加速访问
  #   - Apache 官方: 原始下载地址
  #   - 清华镜像: 高校/教育网加速
  #
  # 地址选择原则：
  #   - 国内优先使用阿里云 OSS
  #   - 海外使用 Apache 官方
  #   - 离线环境使用预下载包
  download_url: "https://apache-doris-releases.oss-accelerate.aliyuncs.com"

# -----------------------------------------------------------------------------
# 镜像构建配置
# -----------------------------------------------------------------------------
build:
  # 基础镜像选择
  # 为什么使用 Ubuntu？
  #   - 官方 Doris 基于 Ubuntu 构建
  #   - 兼容性最好
  #   - 社区支持丰富
  #
  # 为什么用 22.04 而不是更新的 24.04？
  #   - 22.04 是 LTS 版本，稳定
  #   - 24.04 太新，可能有兼容性问题
  #   - 官方默认测试版本
  base_image: "ubuntu:22.04"

  # 构建参数（传递给 Dockerfile 的 ARG）
  # 为什么使用 ARG？
  #   - 可以在构建时动态指定
  #   - 同一 Dockerfile 构建不同版本
  #   - CI/CD 流水线集成方便
  args:
    # Doris 版本号
    # 必须与上面的 doris.version 保持一致！
    # 用途：
    #   - 下载对应版本的安装包
    #   - 设置环境变量
    DORIS_VERSION: "4.0.4"

    # Java 版本
    # 为什么需要指定？
    #   - FE 依赖 JVM 运行
    #   - 11 是官方推荐的 LTS 版本
    #   - 17 是未来的趋势
    JAVA_VERSION: "11"

# -----------------------------------------------------------------------------
# 安全配置
# -----------------------------------------------------------------------------
# 为什么关注安全配置？
#   - 生产镜像必须考虑安全性
#   - 减少攻击面
#   - 合规要求
#
security:
  # 非 root 用户运行
  # 为什么？
  #   - 容器内 root 权限等同于宿主机 root
  #   - 减少权限滥用风险
  #   - 遵循最小权限原则
  # 注意：
  #   - 需要在 Dockerfile 中创建用户
  #   - 部分功能可能需要额外权限
  run_as_non_root: true

  # 最小化基础包
  # 为什么？
  #   - 减少镜像体积
  #   - 减少攻击面
  #   - 加快部署速度
  # 实现方式：
  #   - 使用 --no-install-recommends
  #   - 移除文档和示例
  minimal_base: true

  # 安全扫描
  # 为什么？
  #   - 定期扫描已知漏洞
  #   - 确保基础镜像安全
  #   - CI/CD 中自动执行
  # 常用工具：
  #   - Trivy: 轻量级漏洞扫描
  #   - Grype: Syft 出品
  #   - Clair: 红帽出品
  scan_enabled: true

# -----------------------------------------------------------------------------
# 镜像命名规范
# -----------------------------------------------------------------------------
# 为什么需要命名规范？
#   - 统一团队命名风格
#   - 便于脚本自动化处理
#   - 区分不同用途的镜像
#
images:
  # FE 镜像
  # 用途：构建 Frontend 节点镜像
  fe: "doris-fe"

  # BE 镜像
  # 用途：构建 Backend 节点镜像
  be: "doris-be"

  # FoundationDB 镜像
  # 用途：部分高级特性需要 FoundationDB
  # 注意：普通部署不需要
  fdb: "foundationdb"

# -----------------------------------------------------------------------------
# 镜像仓库配置
# -----------------------------------------------------------------------------
# 为什么需要仓库配置？
#   - 本地测试使用本地仓库
#   - 生产使用私有仓库
#   - 便于 CI/CD 集成
#
registry:
  # 本地仓库（测试用）
  # 为什么需要？
  #   - 开发测试时快速验证
  #   - 不依赖外部网络
  #   - 构建后立即测试
  local: "localhost:5000"

  # 远程私有仓库（生产用）
  # 为什么使用私有仓库？
  #   - 安全性：镜像不公开
  #   - 速度：内网传输更快
  #   - 版本控制：统一管理
  remote: "nexus.company.com:8082"

# =============================================================================
# 版本特性说明
# =============================================================================
#
# Doris 2.1.x 主要特性：
#   - 资源隔离增强
#   - 更好的查询优化
#   - 性能提升 30%+
#   - 存储计算分离支持
#
# 选择版本的考虑因素：
#   1. 稳定性：生产环境优先 LTS 版本
#   2. 功能：需要新功能可选新版本
#   3. 兼容性：与现有系统兼容
#   4. 支持周期：LTS 版本支持更长
#
# 镜像构建最佳实践：
#   1. 使用特定版本号，避免 latest
#   2. 定期更新基础镜像补丁
#   3. 启用安全扫描
#   4. 记录构建日志和 checksum
#
# =============================================================================
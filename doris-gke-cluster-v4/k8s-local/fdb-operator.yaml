# =============================================================================
# FoundationDB Kubernetes Operator 部署配置
# =============================================================================
# 作用: 管理 FoundationDB 集群的生命周期
# 适用: 本地开发环境 (k8s-local)
# 版本: 7.1.37
#
# 前置条件:
#   - Kubernetes 1.26+
#   - 默认存储类或已配置的 StorageClass
#
# 部署顺序:
#   1. kubectl apply -f fdb-operator.yaml
#   2. kubectl apply -f fdbcluster.yaml
#   3. 等待 FDB 集群就绪
# =============================================================================

---
# -----------------------------------------------------------------------------
# Namespace (可选 - 分离 FDB 到独立命名空间)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/managed-by: kubectl

---
# -----------------------------------------------------------------------------
# CRD: FoundationDBCluster
# -----------------------------------------------------------------------------
# 说明: 定义 FoundationDB 集群资源
# 来源: https://github.com/FoundationDB/fdb-kubernetes-operator/config/crd/bases

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foundationdbclusters.apps.foundationdb.org
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: fdb-operator
spec:
  group: apps.foundationdb.org
  names:
    kind: FoundationDBCluster
    listKind: FoundationDBClusterList
    plural: foundationdbclusters
    singular: foundationdbcluster
    shortNames:
      - fdb
      - fdbcluster
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                version:
                  type: string
                image:
                  type: string
                instanceIDSource:
                  type: string
                podBuildMetadata:
                  type: object
                mainContainer:
                  type: object
                sidecarContainer:
                  type: object
                trustedCertificates:
                  type: object
                kustomizeConfig:
                  type: object
                faultDomain:
                  type: object
                dataCenter:
                  type: string
                databaseConfiguration:
                  type: object
                processCounts:
                  type: object
                podLabelConfig:
                  type: object
                resources:
                  type: object
                nodeSelector:
                  type: object
                priorityClassName:
                  type: string
                tolerations:
                  type: array
                  items:
                    type: object
                services:
                  type: object
                storageClass:
                  type: string
                storageDefinition:
                  type: object
                persistentVolumeClaimSpec:
                  type: object
                volumeClaimSpec:
                  type: object
                enableTLS:
                  type: boolean
                tlsSecretRef:
                  type: string
                KvReplicatorImage:
                  type: string
                logGroup:
                  type: string
                logLevel:
                  type: string
                noiseLevel:
                  type: string
                exportMetrics:
                  type: boolean
                metricsPrefix:
                  type: string
                sidecarVariables:
                  type: object
                initContainers:
                  type: object
                containers:
                  type: object
                selector:
                  type: object
                topology:
                  type: object
                routing:
                  type: object
                minimumUptimeSecondsBeforeRestart:
                  type: integer
                killProcesses:
                  type: boolean
                skip:
                  type: boolean
                autoResolve:
                  type: boolean
                removeProcesses:
                  type: array
                  items:
                    type: string
              status:
                type: object

---
# -----------------------------------------------------------------------------
# ServiceAccount: FDB Operator
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator

---
# -----------------------------------------------------------------------------
# ClusterRole: FDB Operator 权限
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - pods
      - pods/exec
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters
      - foundationdbbackups
      - foundationdbrestores
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters/status
      - foundationdbclusters/finalizers
      - foundationdbbackups/status
      - foundationdbbackups/finalizers
      - foundationdbrestores/status
      - foundationdbrestores/finalizers
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete

---
# -----------------------------------------------------------------------------
# ClusterRoleBinding: 绑定 Operator SA 到 ClusterRole
# -----------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
roleRef:
  kind: ClusterRole
  name: foundationdb-kubernetes-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: foundationdb-kubernetes-operator
    namespace: foundationdb

---
# -----------------------------------------------------------------------------
# Deployment: FDB Kubernetes Operator
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foundationdb
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundationdb
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: foundationdb-kubernetes-operator
      containers:
        - name: operator
          image: foundationdb/foundationdb:7.1.37
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: FDB_KUBERNETES_OPERATOR_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_KUBERNETES_INIT_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_POD_LOG_GROUP
              value: foundationdb
            - name: LOG_LEVEL
              value: INFO
            - name: FDB_POD_LOG_LEVEL
              value: INFO
            - name: FDB_DISABLE_POD_LEVEL_LOGGING
              value: "false"
            - name: FDB_IMAGE_TYPE
              value: unified
            - name: FDB_IMAGE_PULL_POLICY
              value: Never
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

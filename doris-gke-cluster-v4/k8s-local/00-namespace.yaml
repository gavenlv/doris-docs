apiVersion: v1
kind: Namespace
metadata:
  name: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/managed-by: kubectl
    environment: development
    app.kubernetes.io/description: apache-doris-cluster-local-dev

---
# =============================================================================
# StorageClass 定义
# =============================================================================
# 本地开发使用 host-path 存储类
# 生产环境请使用云存储 (GCE PD / AWS EBS / Azure Disk)

# StorageClass - FE 元数据存储
# FE 存储元数据（表结构、用户权限等），元数据丢失会导致集群无法恢复
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: doris-fe-storage
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe
provisioner: kubernetes.io/host-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
# StorageClass - BE 数据存储
# BE 存储实际数据和查询中间结果
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: doris-be-storage
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: be
provisioner: kubernetes.io/host-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
# =============================================================================
# ServiceAccount 定义
# =============================================================================
# Pod 访问 Kubernetes API 的身份凭证
# Doris Operator 管理 FE/BE Pod 时需要

apiVersion: v1
kind: ServiceAccount
metadata:
  name: doris-fe
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doris-be
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: be

---
# =============================================================================
# RBAC 配置
# =============================================================================
# 基于角色的访问控制，控制 ServiceAccount 对 K8s 资源的访问权限
# 遵循最小权限原则

# FE Role - FE Pod 的权限（仅 doris 命名空间内）
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: doris-fe-role
  namespace: doris
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]

---
# FE RoleBinding - 将 Role 绑定到 FE ServiceAccount
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: doris-fe-rolebinding
  namespace: doris
subjects:
  - kind: ServiceAccount
    name: doris-fe
    namespace: doris
roleRef:
  kind: Role
  name: doris-fe-role
  apiGroup: rbac.authorization.k8s.io

---
# BE Role - BE Pod 的权限
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: doris-be-role
  namespace: doris
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]

---
# BE RoleBinding - 将 Role 绑定到 BE ServiceAccount
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: doris-be-rolebinding
  namespace: doris
subjects:
  - kind: ServiceAccount
    name: doris-be
    namespace: doris
roleRef:
  kind: Role
  name: doris-be-role
  apiGroup: rbac.authorization.k8s.io

# =============================================================================
# ConfigMap 配置 - Doris 组件配置文件
# =============================================================================
#
# 本文件包含:
# 1. FE 配置 (fe-config) - Frontend 配置文件
# 2. BE 配置 (be-config) - Backend Compute Node 配置文件
#
# 存算分离架构说明:
#   - BECN (计算节点) 不存储数据，数据存在 MinIO
#   - BE 配置中的 storage_root_path 仅用于本地缓存
#   - MinIO S3 配置通过 configMapInfo 引用
# =============================================================================

# -----------------------------------------------------------------------------
# FE ConfigMap - Frontend 配置
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: fe-config
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe
    app.kubernetes.io/part-of: doris
data:
  fe.conf: |
    # FE 元数据目录
    # 说明: 存储 Doris 元数据（表结构、用户信息等）
    # 重要: 元数据丢失会导致集群无法恢复
    meta_dir: /opt/doris/fe/doris-meta

    # 日志级别
    # 可选值: INFO, WARN, ERROR, FATAL
    log_level: INFO

    # 查询端口 (MySQL 协议)
    query_port: 9030

    # HTTP 端口 (Web UI)
    http_port: 8030

    # RPC 端口 (FE-FE 通信)
    rpc_port: 9010

    # Edit Log 端口 (FE-FE 元数据同步)
    edit_log_port: 9010

    # 优先级网络 (指定 FE 监听的网卡)
    # 开发环境自动检测，生产环境建议显式指定
    # priority_networks: 192.168.0.0/16

    # 最大连接数
    max_connections: 4096

    # 查询超时时间 (秒)
    query_timeout: 3600

    # 元数据同步超时 (秒)
    edit_log_sync_timeout: 60

# -----------------------------------------------------------------------------
# BE ConfigMap - Backend Compute Node 配置
# -----------------------------------------------------------------------------
# 说明: BECN 是存算分离架构中的计算节点
#       数据存储在 MinIO，本地仅用于缓存热数据
apiVersion: v1
kind: ConfigMap
metadata:
  name: be-config
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: becn
    app.kubernetes.io/part-of: doris
data:
  be.conf: |
    # ========================================================================
    # 集群配置
    # ========================================================================

    # BE 端口配置
    be_port: 9060
    brpc_port: 9050
    webserver_port: 8040
    heartbeat_service_port: 9050
    arrow_flight_sql_port: 9070

    # 优先级网络 (指定 BE 监听的网卡)
    # priority_networks: 192.168.0.0/16

    # ========================================================================
    # 存储配置 - 存算分离核心！
    # ========================================================================

    # 本地存储路径 (仅用于热数据缓存)
    # 说明: 存算分离模式下，数据主要存在 MinIO
    #       本地存储仅用于缓存热数据，提升查询性能
    # 格式: <path>:<medium>[:<capacity>]
    # medium: HDD / SSD / fusion
    storage_root_path: /opt/doris/be/storage

    # ========================================================================
    # S3 对象存储配置 - MinIO
    # ========================================================================
    # 说明: 配置 BE 访问 MinIO (S3 兼容存储)
    # 与 GKE 版本配置类似，仅 endpoint 不同

    # 是否启用对象存储
    enable_storage_volume: true

    # 对象存储运行时配置
    obj_runtime:
      # 提供商: S3 (MinIO, AWS S3, GCS 等)
      provider: S3
      # MinIO API 端点
      endpoint: "http://minio.foundationdb.svc.cluster.local:9000"
      # Bucket 名称
      bucket: doris-data
      # 路径前缀
      prefix: be_data
      # 连接池大小
      connectionpool: 16
      # 超时时间 (秒)
      timeout: 3600
      # 区域 (MinIO 不强制需要)
      region: us-east-1

    # ========================================================================
    # 线程配置
    # ========================================================================

    # BE 工作线程数
    num_threads: 8

    # 导入线程数
    import_num_threads: 4

    # 刷新线程数
    flush_thread_num_per_store: 2

    # ========================================================================
    # 内存配置
    # ========================================================================

    # BE 内存限制
    # 说明: 设置为容器内存限制的 80%
    memory_limit: 12G

    # 读缓存大小
    read_cache_size: 4G

    # 对象存储缓存大小
    obj_pool_cache_size: 2G

    # 数据块缓存
    enable_data_block_cache: true
    data_block_cache_size: 4G

    # ========================================================================
    # 查询配置
    # ========================================================================

    # 查询超时 (秒)
    query_timeout: 3600

    # 最大扫描行数
    max_scan_key_num: -1

    # ========================================================================
    # 压缩配置
    # ========================================================================

    # 压缩算法: ZSTD / LZ4 / LZ4HC / ZLIB
    compression_codec: ZSTD

    # 字典编码
    enable_dict_encoding: true

    # ========================================================================
    # 向量化执行
    # ========================================================================

    enable_vectorized_engine: true

    # ========================================================================
    # 监控和日志
    # ========================================================================

    log_level: INFO
    sys_log_dir: /opt/doris/be/log

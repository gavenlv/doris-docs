# =============================================================================
# DorisCluster 自定义资源定义 - 本地开发配置
# =============================================================================
#
# 部署前提：
# 1. Doris Operator 已部署 (kubectl apply -f operator.yaml)
# 2. doris 命名空间已创建 (kubectl apply -f 00-namespace.yaml)
#
# 部署命令:
#   kubectl apply -f doriscluster.yaml
#
# 查看状态:
#   kubectl get dcr -n doris
#   kubectl get pods -n doris
# =============================================================================

apiVersion: doris.selectdb.com/v1
kind: DorisCluster
metadata:
  name: doriscluster-local
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/instance: doriscluster-local
    environment: development

spec:
  # ---------------------------------------------------------------------------
  # FE 配置 - Frontend 节点
  # ---------------------------------------------------------------------------
  # FE 负责 SQL 解析、查询协调、元数据管理
  # 采用 Leader-Follower 模式，开发环境 1-3 副本
  feSpec:
    replicas: 1
    image: ${NEXUS_REGISTRY}/apache/doris:4.0.4-secure
    imagePullSecrets:
      - name: doris-registry
    limits:
      cpu: 2
      memory: 8Gi
    requests:
      cpu: 1
      memory: 4Gi
    service:
      type: NodePort

  # ---------------------------------------------------------------------------
  # BE 配置 - Backend 节点
  # ---------------------------------------------------------------------------
  # BE 负责数据存储和查询执行
  beSpec:
    replicas: 1
    image: ${NEXUS_REGISTRY}/apache/doris:4.0.4-secure
    imagePullSecrets:
      - name: doris-registry
    limits:
      cpu: 4
      memory: 16Gi
    requests:
      cpu: 2
      memory: 8Gi
    # 不使用 configMapInfo，使用镜像默认配置
    # BE 使用 emptyDir 存储 (开发环境)
    service:
      type: ClusterIP

---
# Secret - MinIO 凭证（开发环境可选，预留字段）
apiVersion: v1
kind: Secret
metadata:
  name: minio-credential
  namespace: doris
type: Opaque
stringData:
  username: root
  password: ""

# =============================================================================
# 资源规划建议
# =============================================================================
#
# | 环境 | FE 规格        | BE 规格         | 副本数        |
# |------|---------------|-----------------|--------------|
# | 开发 | 1-2核 / 4-8Gi | 2-4核 / 8-16Gi  | 1 FE + 1 BE  |
# | 测试 | 2-4核 / 8-16Gi| 4-8核 / 16-32Gi | 2 FE + 3 BE  |
# | 生产 | 4-8核 / 16-32Gi| 8-16核 / 32-64Gi| 3 FE + 6+ BE |
#
# 端口说明:
# FE: http_port=8030, query_port=9030, rpc_port=9020, edit_log_port=9010
# BE: webserver_port=8040, heartbeat_service_port=9050, brpc_port=8060
#
# 删除集群:
#   kubectl delete -f doriscluster.yaml
# =============================================================================

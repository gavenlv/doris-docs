# Simplified FDB Operator deployment (without problematic CRD)
---
apiVersion: v1
kind: Namespace
metadata:
  name: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/managed-by: kubectl

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - pods
      - pods/exec
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters
      - foundationdbbackups
      - foundationdbrestores
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters/status
      - foundationdbclusters/finalizers
      - foundationdbbackups/status
      - foundationdbbackups/finalizers
      - foundationdbrestores/status
      - foundationdbrestores/finalizers
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foundationdb-kubernetes-operator
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
roleRef:
  kind: ClusterRole
  name: foundationdb-kubernetes-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: foundationdb-kubernetes-operator
    namespace: foundationdb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: foundationdb
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foundationdb
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundationdb
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: foundationdb-kubernetes-operator
      containers:
        - name: operator
          image: foundationdb/foundationdb:7.1.37
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: FDB_KUBERNETES_OPERATOR_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_KUBERNETES_INIT_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_POD_LOG_GROUP
              value: foundationdb
            - name: LOG_LEVEL
              value: INFO
            - name: FDB_POD_LOG_LEVEL
              value: INFO
            - name: FDB_DISABLE_POD_LEVEL_LOGGING
              value: "false"
            - name: FDB_IMAGE_TYPE
              value: unified
            - name: FDB_IMAGE_PULL_POLICY
              value: Never
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

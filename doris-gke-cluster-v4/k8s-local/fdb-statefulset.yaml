# FDB 集群部署 - 直接使用 StatefulSet (不依赖 Operator/CRD)
apiVersion: v1
kind: Namespace
metadata:
  name: foundationdb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fdb-config
  namespace: foundationdb
data:
  fdb.cluster: |
    # 格式: 集群ID:代系:IP:端口:本地目录:自动选主
    # 这是一个3节点的测试集群
    docker:1f2c3d4e5f6@10.244.0.11:4500,/var/fdb/data:1
    docker:1f2c3d4e5f6@10.244.0.12:4500,/var/fdb/data:1
    docker:1f2c3d4e5f6@10.244.0.13:4500,/var/fdb/data:1
  fdbmonitor-conf: |
    [general]
    cluster_file = /var/fdb/fdb.cluster
    ip_address = 10.244.0.11
    datadir = /var/fdb/data/2.1.10
    local-address = 10.244.0.11

    [fdbserver.1]
    command = fdbserver
    public-address = 10.244.0.11:4500:tls
    listen-address = 10.244.0.11:4500:tls
    datadir = /var/fdb/data/2.1.10
    class = storage

    [fdbserver.2]
    command = fdbserver
    public-address = 10.244.0.11:4501:tls
    listen-address = 10.244.0.11:4501:tls
    datadir = /var/fdb/data/2.1.10
    class = transaction

    [backup_agent]
    command = fdbbackup
    instances = 1
---
apiVersion: v1
kind: Service
metadata:
  name: fdb-service
  namespace: foundationdb
spec:
  selector:
    app: fdb
  ports:
    - name: tls
      port: 4500
      targetPort: 4500
    - name: backup
      port: 4510
      targetPort: 4510
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fdb-cluster
  namespace: foundationdb
spec:
  serviceName: fdb-service
  replicas: 3
  selector:
    matchLabels:
      app: fdb
  template:
    metadata:
      labels:
        app: fdb
    spec:
      containers:
        - name: fdb
          image: foundationdb/foundationdb:7.1.37
          imagePullPolicy: Never
          ports:
            - containerPort: 4500
              name: tls
            - containerPort: 4510
              name: backup
          env:
            - name: FDB_CLUSTER_FILE
              value: /var/fdb/fdb.cluster
          args:
            - --cluster-file=/var/fdb/fdb.cluster
            - --class=storage
            - --public-address=${FDB_POD_IP}:4500:tls
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: fdb-data
              mountPath: /var/fdb/data
            - name: fdb-config
              mountPath: /var/fdb/fdb.cluster
              subPath: fdb.cluster
          readinessProbe:
            exec:
              command:
                - fdbcli
                - --exec
                - "status"
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - fdbcli
                - --exec
                - "status"
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: fdb-config
          configMap:
            name: fdb-config
            items:
              - key: fdb.cluster
                path: fdb.cluster
  volumeClaimTemplates:
    - metadata:
        name: fdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi

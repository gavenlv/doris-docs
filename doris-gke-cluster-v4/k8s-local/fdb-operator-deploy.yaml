# FDB Operator 部署（不包含 CRD - CRD 已单独部署）
apiVersion: v1
kind: Namespace
metadata:
  name: foundationdb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foundationdb-kubernetes-operator
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - persistentvolumeclaims
      - pods
      - pods/exec
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - patch
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters
      - foundationdbbackups
      - foundationdbrestores
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
  - apiGroups:
      - apps.foundationdb.org
    resources:
      - foundationdbclusters/status
      - foundationdbclusters/finalizers
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foundationdb-kubernetes-operator
roleRef:
  kind: ClusterRole
  name: foundationdb-kubernetes-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: foundationdb-kubernetes-operator
    namespace: foundationdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundationdb-kubernetes-operator
  namespace: foundationdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foundationdb
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundationdb
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: foundationdb-kubernetes-operator
      containers:
        - name: operator
          image: foundationdb/foundationdb:7.1.37
          imagePullPolicy: Never
          ports:
            - name: metrics
              containerPort: 8080
          env:
            - name: FDB_KUBERNETES_OPERATOR_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_KUBERNETES_INIT_IMAGE
              value: foundationdb/foundationdb:7.1.37
            - name: FDB_POD_LOG_GROUP
              value: foundationdb
            - name: LOG_LEVEL
              value: INFO
            - name: FDB_IMAGE_PULL_POLICY
              value: Never
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

# =============================================================================
# DorisDisaggregatedCluster HPA 配置 - 存算分离架构
# =============================================================================
#
# 架构说明:
#   - DorisDisaggregatedCluster 使用存算分离设计
#   - FE (Frontend): SQL 解析、查询协调、元数据管理 → StatefulSet
#   - BECN (Backend Compute Node): 仅计算，数据存在 S3/MinIO → StatefulSet
#
# 扩缩容策略:
#   - FE: 扩容保守 (Raft 元数据同步开销)
#   - BECN: 扩容积极 (无本地数据，扩缩容轻量)
#
# 手动扩缩容:
#   kubectl scale statefulset doris-disagg-cluster-fe --replicas=5 -n doris
#   kubectl scale statefulset doris-disagg-cluster-becn --replicas=6 -n doris
#
# 自动扩缩容前置条件: metrics-server 运行
#   kubectl top pods -n doris  # 验证 metrics-server 可用
#
# 查看 HPA:
#   kubectl get hpa -n doris
#   kubectl describe hpa doris-fe-hpa -n doris
# =============================================================================

# ---------------------------------------------------------------------------
# FE HPA - Frontend 自动扩缩容
# ---------------------------------------------------------------------------
# FE 特点: SQL 解析、查询协调、元数据管理
# 扩缩容建议: 保守 (Raft 协议需要奇数副本，元数据同步有开销)
# minReplicas=3 (高可用要求)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doris-fe-hpa
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: fe
    app.kubernetes.io/part-of: doris-disagg-cluster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: doris-disagg-cluster-fe

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15

---
# ---------------------------------------------------------------------------
# BECN HPA - Backend Compute Node 自动扩缩容
# ---------------------------------------------------------------------------
# BECN 特点: 仅计算节点，数据存储在 S3/MinIO
# 扩缩容建议: 可相对积极 (无本地数据，扩缩容轻量)
# minReplicas=3 (高可用要求)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doris-becn-hpa
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: becn
    app.kubernetes.io/part-of: doris-disagg-cluster
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: doris-disagg-cluster-becn

  minReplicas: 3
  maxReplicas: 20

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 3
          periodSeconds: 15
      selectPolicy: Max

# =============================================================================
# HPA 扩缩容指南
# =============================================================================
#
# 扩容触发: CPU > 70% 或 内存 > 80% 持续一段时间
# 缩容触发: CPU < 50% 且 内存 < 60% 持续 5 分钟
#
# 手动扩缩容 (kubectl):
#   FE:  kubectl scale statefulset doris-disagg-cluster-fe --replicas=5 -n doris
#   BECN: kubectl scale statefulset doris-disagg-cluster-becn --replicas=6 -n doris
#
# 查看副本数:
#   kubectl get statefulset -n doris
#   kubectl get pods -n doris
#
# 扩缩容最佳实践:
#   - 扩容: 可相对激进，副本启动快
#   - 缩容: 保守策略，等待足够长稳定时间
#   - 监控: 扩缩容期间观察查询延迟和错误率
#   - 测试: 生产部署前在测试环境验证扩缩容流程
# =============================================================================

# =============================================================================
# MinIO StatefulSet + Service 配置
# =============================================================================
# 作用: 提供 S3 兼容对象存储，作为 Doris BE 的数据存储后端
# 模式: 独立模式 (单节点，适合开发测试)
# 版本: RELEASE.2024-01-16
#
# 架构说明:
#   MinIO 在本地开发环境中作为独立存储服务运行:
#   - 类似 GKE 版本的 GCS
#   - BE 通过 S3 协议写入/读取数据
#   - 存储计算分离: BE 只做计算，数据存在 MinIO
#
# 访问方式:
#   - API: http://minio.foundationdb.svc.cluster.local:9000
#   - Console: http://minio.foundationdb.svc.cluster.local:9001
#   - Bucket: doris-data
#
# 凭证 (与 secret.yaml 中的 minio-credential 对应):
#   - Access Key: minioadmin
#   - Secret Key: minioadmin
#
# 部署顺序:
#   1. kubectl apply -f minio-statefulset.yaml
#   2. 等待 MinIO 就绪
#   3. 创建 Bucket (通过 mc client 或 init script)
# =============================================================================

---
# -----------------------------------------------------------------------------
# Namespace: foundationdb (与 FDB 共享命名空间)
# 注: MinIO 也可以放在 doris 命名空间，这里为方便管理放在 foundationdb
# -----------------------------------------------------------------------------

---
# -----------------------------------------------------------------------------
# Headless Service: 为 StatefulSet 提供稳定的网络标识
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris
spec:
  # 无头服务 - 不分配 ClusterIP
  # Pod 通过 <pod-name>.minio.foundationdb.svc.cluster.local 访问
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
  ports:
    # MinIO API 端口
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    # MinIO Console 端口 (Web UI)
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP

---
# -----------------------------------------------------------------------------
# StatefulSet: MinIO 服务器
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris
spec:
  # 无头服务名称
  serviceName: minio
  replicas: 1  # 独立模式，生产使用 Erasure Code 模式需要 4+ 节点

  # Pod 选择器
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: storage

  # 更新策略: RollingUpdate (滚动更新)
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # 确保零停机

  # Pod 管理策略: OrderedReady (按顺序创建/删除)
  podManagementPolicy: OrderedReady

  # 模板
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: doris
    spec:
      # 终止前优雅关闭时间
      terminationGracePeriodSeconds: 30

      # 初始化容器: 创建目录
      initContainers:
        - name: create-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/minio /data/minio/{.system,.metadata,tmp,doris-data} && \
              echo "MinIO data directory initialized"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      # 主容器: MinIO
      containers:
        - name: minio
          # 官方稳定版
          image: minio/minio:RELEASE.2024-01-16T20-51-57Z
          imagePullPolicy: IfNotPresent

          # 命令: 以 server 模式启动
          # 使用 /data 作为存储根目录
          # --address: API 监听地址 (0.0.0.0:9000)
          # --console-address: Console 监听地址 (0.0.0.0:9001)
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # 创建默认 bucket (如果不存在)
              mc alias set local http://localhost:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
              mc mb local/doris-data --ignore-existing
              mc anonymous set download local/doris-data
              # 启动 MinIO
              minio server /data \
                --address ":9000" \
                --console-address ":9001" \
                --certs-dir "/etc/minio/certs" \
                2>&1

          # 环境变量: MinIO 凭证
          env:
            # Access Key (与 secret.yaml minio-credential 对应)
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credential
                  key: accessKey
                  optional: false
            # Secret Key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credential
                  key: secretKey
                  optional: false

          # 端口
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP

          # 探针: 就绪探针
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # 探针: 存活探针
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # 探针: 启动探针 (给 MinIO 充足时间初始化)
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30  # 30 * 10 = 300 秒 = 5 分钟

          # 资源限制 (开发环境降低资源占用)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1
              memory: 1Gi
              ephemeral-storage: 10Gi

          # 卷挂载
          volumeMounts:
            - name: data
              mountPath: /data
            # - name: certs
            #   mountPath: /etc/minio/certs
            #   readOnly: true

          # 环境变量 (附加)
          env:
            - name: MINIO_SMS_DRIVE_URL
              value: "local"
            - name: MINIO_BROWSER
              value: "on"
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"

      # 数据卷声明模板
      # 为每个 Pod 创建一个 PVC
      volumeClaimTemplates:
        - metadata:
            name: data
            labels:
              app.kubernetes.io/name: minio
              app.kubernetes.io/component: storage
          spec:
            accessModes:
              - ReadWriteOnce
            # 使用 host-path 存储类 (与 FDB、BE 共用)
            storageClassName: doris-be-storage
            resources:
              requests:
                storage: 10Gi  # 开发环境 10Gi; 生产建议 100Gi+

  # 卷声明模板 (备用 - 如果上面的不生效)
  # volumeClaimTemplates:
  #   - metadata:
  #       name: data
  #   spec:
  #       accessModes: ["ReadWriteOnce"]
  #       storageClassName: "doris-be-storage"
  #       resources:
  #         requests:
  #           storage: 10Gi

---
# -----------------------------------------------------------------------------
# Secret: MinIO 凭证 (在 doris 命名空间)
# 注: MinIO Pod 在 foundationdb 命名空间，通过引用访问 doris 命名空间的 Secret
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: minio-credential
  namespace: foundationdb
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
type: Opaque
data:
  # 凭证: minioadmin / minioadmin
  # echo -n "minioadmin" | base64
  accessKey: bWluaW9hZG1pbg==
  secretKey: bWluaW9hZG1pbg==

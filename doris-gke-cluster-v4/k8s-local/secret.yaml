# =============================================================================
# Secret 配置 - 敏感信息存储
# =============================================================================
#
# 什么是 Secret？
# - Kubernetes 用于存储敏感配置的资源
# - 数据以 base64 编码存储
# - 可以被 Pod 挂载为文件或注入为环境变量
#
# Secret 类型：
# - Opaque: 通用类型，存储任意键值对
# - kubernetes.io/tls: 存储 TLS 证书
# - kubernetes.io/dockerconfigjson: 存储镜像仓库凭证
# - kubernetes.io/service-account-token: 服务账户令牌
#
# 为什么使用 Secret？
# - 存储密码、API 密钥、证书等敏感信息
# - 与普通 ConfigMap 分离，提高安全性
# - 可以配合 RBAC 控制访问权限
#
# 注意事项：
# - Secret 数据只是 base64 编码，非加密
# - 需要额外机制（如加密配置）来真正保护数据
# - 生产环境建议使用外部密钥管理服务 (Vault, AWS Secrets Manager 等)
#
# 本文件用途：
# - 存储 MinIO/S3 对象存储的访问凭证
# - 存储 Doris 集群内部通信的认证信息
# =============================================================================

# -----------------------------------------------------------------------------
# MinIO 访问凭证 Secret
# -----------------------------------------------------------------------------
# 说明: 存储 S3 兼容对象存储的访问密钥
# 用途: Doris BE 访问 MinIO 远程存储时需要
# 注意: 开发环境使用简单密码，生产环境务必使用强密码

apiVersion: v1
kind: Secret
metadata:
  name: minio-credential
  namespace: doris
  labels:
    app.kubernetes.io/name: doris
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: doris
type: Opaque
data:
  # accessKey: 访问密钥 ID (base64 编码)
  # 原值: minioadmin
  # 注意: 这是 MinIO 默认的访问密钥
  #       开发环境可直接使用，生产环境必须修改
  accessKey: bWluaW9hZG1pbg==

  # secretKey: 访问密钥密码 (base64 编码)
  # 原值: minioadmin
  # 注意: 这是 MinIO 默认的访问密码
  #       开发环境可直接使用，生产环境务必修改为强密码
  secretKey: bWluaW9hZG1pbg==

# =============================================================================
# Secret 使用说明
# =============================================================================
#
# 创建 Secret 的方法:
#
# 方法 1: kubectl 命令创建
#   kubectl create secret generic minio-credential \
#     --from-literal=accessKey=minioadmin \
#     --from-literal=secretKey=minioadmin \
#     -n doris
#
# 方法 2: YAML 文件 (已提供)
#   kubectl apply -f secret.yaml
#
# 方法 3: 从文件创建
#   echo -n 'minioadmin' | base64  # 编码
#   kubectl create secret generic minio-credential \
#     --from-file=./accessKey.txt \
#     --from-file=./secretKey.txt \
#     -n doris
#
# 查看 Secret:
#   kubectl get secret minio-credential -n doris
#   kubectl describe secret minio-credential -n doris
#
# 解码 Secret:
#   kubectl get secret minio-credential -n doris -o jsonpath='{.data.accessKey}' | base64 -d
#   kubectl get secret minio-credential -n doris -o jsonpath='{.data.secretKey}' | base64 -d
#
# 在 Pod 中使用 Secret:
#
# 方法 1: 环境变量注入
#   env:
#     - name: MINIO_ACCESS_KEY
#       valueFrom:
#         secretKeyRef:
#           name: minio-credential
#           key: accessKey
#     - name: MINIO_SECRET_KEY
#       valueFrom:
#         secretKeyRef:
#           name: minio-credential
#           key: secretKey
#
# 方法 2: 文件挂载
#   volumeMounts:
#     - name: minio-cred
#       mountPath: /etc/minio
#       readOnly: true
#   volumes:
#     - name: minio-cred
#       secret:
#         secretName: minio-credential
#
# 更新 Secret:
#   kubectl apply -f secret.yaml
#   注意: Pod 需要重启才能看到更新后的 Secret
#
# 删除 Secret:
#   kubectl delete -f secret.yaml
#
# =============================================================================
# 安全建议
# =============================================================================
#
# 1. 最小权限原则
#    - 只授予必要的访问权限
#    - 定期轮换密钥
#
# 2. 密钥强度
#    - 生产环境使用随机生成的强密码
#    - 长度至少 16 位，包含大小写字母、数字、特殊字符
#
# 3. 密钥管理
#    - 不要将密钥提交到代码仓库
#    - 使用外部密钥管理服务 (Vault, AWS Secrets Manager)
#    - 启用 Kubernetes Secret 加密
#
# 4. 监控审计
#    - 监控 Secret 访问日志
#    - 设置异常访问告警
#
# 5. 备份恢复
#    - 定期备份 Secret
#    - 测试恢复流程
# =============================================================================
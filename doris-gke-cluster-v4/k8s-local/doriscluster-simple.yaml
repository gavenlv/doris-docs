# DorisCluster 简化部署 - 传统模式
apiVersion: v1
kind: Namespace
metadata:
  name: doris
---
apiVersion: doris.apache.com/v1
kind: DorisCluster
metadata:
  name: doris-cluster
  namespace: doris
spec:
  feSpec:
    replicas: 1
    image: apache/doris:fe-3.1.4
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    storage:
      storageClassName: standard
      capacity: 10Gi
  beSpec:
    replicas: 1
    image: apache/doris:be-3.1.4
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 2
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    storage:
      storageClassName: standard
      capacity: 50Gi

# Doris Operator 部署
apiVersion: v1
kind: Namespace
metadata:
  name: doris-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doris-operator
  namespace: doris-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: doris-operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - podtemplates
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - deployments/finalizers
      - replicasets
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - doris.apache.com
    resources:
      - "*"
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - doris.apache.com
    resources:
      - "*/finalizers"
    verbs:
      - update
  - apiGroups:
      - doris.apache.com
    resources:
      - "*/status"
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: doris-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: doris-operator
subjects:
  - kind: ServiceAccount
    name: doris-operator
    namespace: doris-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doris-operator
  namespace: doris-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: doris-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doris-operator
    spec:
      serviceAccountName: doris-operator
      containers:
        - name: operator
          image: apache/doris:operator-1.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: doris-operator

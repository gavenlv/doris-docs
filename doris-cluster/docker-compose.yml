version: '3.8'

services:
  fe1:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:fe-${DORIS_VERSION}
    container_name: doris_fe1
    hostname: fe1
    ports:
      - "9030:9030"
      - "8030:8030"
      - "9010:9010"
    volumes:
      - ./fe/fe1/conf:/opt/doris/fe/conf
      - ./fe/fe1/data:/opt/doris/fe/doris-meta
      - ./fe/fe1/log:/opt/doris/fe/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - FE_ADDR=fe1:9030
      - be_addr=${DORIS_BE1_IP}:9050
      - FE_ADDR=fe1:9030
      - FE_ADDR=fe1:9030
      - FE_ID=1
    networks:
      doris_net:
        ipv4_address: ${DORIS_FE1_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_FE_CPUS}'
          memory: ${DORIS_FE_MEMORY}
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9030", "-u", "root", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

  fe2:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:fe-${DORIS_VERSION}
    container_name: doris_fe2
    hostname: fe2
    ports:
      - "9031:9030"
      - "8031:8030"
      - "9011:9010"
    volumes:
      - ./fe/fe2/conf:/opt/doris/fe/conf
      - ./fe/fe2/data:/opt/doris/fe/doris-meta
      - ./fe/fe2/log:/opt/doris/fe/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - FE_ID=2
      - helper_nodes=172.20.0.11:9010
    networks:
      doris_net:
        ipv4_address: ${DORIS_FE2_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_FE_CPUS}'
          memory: ${DORIS_FE_MEMORY}
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9030", "-u", "root", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

  fe3:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:fe-${DORIS_VERSION}
    container_name: doris_fe3
    hostname: fe3
    ports:
      - "9032:9030"
      - "8032:8030"
      - "9012:9010"
    volumes:
      - ./fe/fe3/conf:/opt/doris/fe/conf
      - ./fe/fe3/data:/opt/doris/fe/doris-meta
      - ./fe/fe3/log:/opt/doris/fe/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - FE_ID=3
      - helper_nodes=172.20.0.11:9010
    networks:
      doris_net:
        ipv4_address: ${DORIS_FE3_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_FE_CPUS}'
          memory: ${DORIS_FE_MEMORY}
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9030", "-u", "root", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

  be1:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:be-${DORIS_VERSION}
    container_name: doris_be1
    hostname: be1
    ports:
      - "9060:9060"
      - "8040:8040"
      - "9050:9050"
    volumes:
      - ./be/be1/conf:/opt/doris/be/conf
      - ./be/be1/data:/opt/doris/be/storage
      - ./be/be1/log:/opt/doris/be/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - BE_ADDR=${DORIS_BE1_IP}:9050
    networks:
      doris_net:
        ipv4_address: ${DORIS_BE1_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_BE_CPUS}'
          memory: ${DORIS_BE_MEMORY}
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

  be2:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:be-${DORIS_VERSION}
    container_name: doris_be2
    hostname: be2
    ports:
      - "9061:9060"
      - "8041:8040"
      - "9051:9050"
    volumes:
      - ./be/be2/conf:/opt/doris/be/conf
      - ./be/be2/data:/opt/doris/be/storage
      - ./be/be2/log:/opt/doris/be/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - BE_ADDR=${DORIS_BE2_IP}:9050
    networks:
      doris_net:
        ipv4_address: ${DORIS_BE2_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_BE_CPUS}'
          memory: ${DORIS_BE_MEMORY}
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

  be3:
    image: zlsmshoqvwt6q1.xuanyuan.run/apache/doris:be-${DORIS_VERSION}
    container_name: doris_be3
    hostname: be3
    ports:
      - "9062:9060"
      - "8042:8040"
      - "9052:9050"
    volumes:
      - ./be/be3/conf:/opt/doris/be/conf
      - ./be/be3/data:/opt/doris/be/storage
      - ./be/be3/log:/opt/doris/be/log
    environment:
      - FE_SERVERS=${DORIS_FE_SERVERS}
      - BE_ADDR=${DORIS_BE3_IP}:9050
    networks:
      doris_net:
        ipv4_address: ${DORIS_BE3_IP}
    deploy:
      resources:
        limits:
          cpus: '${DORIS_BE_CPUS}'
          memory: ${DORIS_BE_MEMORY}
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    privileged: true

networks:
  doris_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DORIS_NETWORK_SUBNET}
